[theme]
base = "light"
primaryColor = "#2F6BD8"
backgroundColor = "#F6F8FB"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F1722"
font = "sans serif"

[server]
maxUploadSize = 50
# Tryb trenera na telefonie: ekran blokowany na przerwę między seriami
# (2–3 min) nie może gubić sesji — domyślnie Streamlit trzyma ją 120 s
disconnectedSessionTTL = 1800
# ikonka i manifest trybu trenera na telefonie: /app/static/
enableStaticServing = true

[global]
# komunikaty od 1 KB (bloki CSS) przeglądarka trzyma w cache i dostaje sam
# hash; przy domyślnych 10 KB szło ~73 KB stylów na każde kliknięcie
# (audyt 2026-09-28: 195 → 125 KB na klik)
minCachedMessageSize = 1000

[browser]
# statystyki użycia Streamlita (page_profile) to ~40% danych każdego pingu
# telefonu i zapytania do data.streamlit.io — wyłączone (audyt 2026-10-04)
gatherUsageStats = false
