<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<!-- w ramce Streamlita szerokość i tak daje iframe; meta przydaje się,
     gdy plik otwiera test na emulowanym telefonie (inaczej układ 980 px) -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* ten sam adres co w app.py — arkusz fontu jest już w pamięci przeglądarki */
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Archivo:wght@400;500;600;700;900&display=swap');
/* Tryb trenera na telefonie — serie do wpisania. Wygląd kółek i sekcji jak
   w widoku zawodnika (vald/ui_training.py → _PV_CSS), BEZ linków do filmów:
   „mogą być te kółka, tylko nie musisz mieć linków" (Filip 2026-09-27).
   Bez position:fixed/sticky i bez vh — ramka ma wysokość treści
   (setFrameHeight), więc „ekran" wewnątrz niej nie istnieje (CLAUDE.md). */
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0;background:transparent;color:#1c1b18;
  font-family:'Archivo',-apple-system,"Segoe UI",system-ui,sans-serif;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;
  touch-action:manipulation}
button,input,textarea{font-family:inherit;color:inherit;margin:0}
button{cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
/* flow-root: marginesy dzieci liczą się do wysokości ramki (setFrameHeight) */
#root{display:flow-root;padding:0 max(0px,env(safe-area-inset-right)) 12px max(0px,env(safe-area-inset-left))}

/* kółko, nazwa, dawka — rozmiary 1:1 z _PV_CSS (pilnuje test_kontrakt_ui) */
.pvslot{width:32px;height:32px;border-radius:999px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.pvname{font-size:16px;font-weight:700;color:#1c1b18;overflow-wrap:anywhere}
.pvdose{font-size:15px;font-weight:700;color:#1c1b18;font-variant-numeric:tabular-nums}
.pvintent{white-space:nowrap;display:inline-block;font-size:12px;font-weight:600;color:oklch(.5 .13 60);background:oklch(.96 .04 75);border-radius:6px;padding:2px 8px;vertical-align:1px;margin-left:2px}
.pvcol{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.pvsec{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin:16px 0 8px}
.pvsec i{display:inline-block;width:4px;height:15px;border-radius:2px;flex-shrink:0}
.sektyt,.sekbtn{display:inline-flex;align-items:center;gap:8px;min-height:44px}
.sekbtn{border:0;background:transparent;padding:0 8px 0 0;font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit}
.chev{font-size:11px;opacity:.7}
.wszystko{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid currentColor;background:#fff;font-size:14px;font-weight:700;letter-spacing:0;text-transform:none;color:inherit;white-space:nowrap}

/* karta ćwiczenia */
.karta{background:#fff;border:1px solid #ebe9e2;border-radius:14px;padding:12px 12px 10px;margin:0 0 10px}
.glowa{display:flex;gap:12px;align-items:flex-start}
.ost{font-size:13px;color:#54514a;font-variant-numeric:tabular-nums}
.det{font-size:12.5px;color:#8a867c}
.kropka{font-size:11.5px;font-weight:600;color:#a09c92;white-space:nowrap;padding-top:3px}
.kropka.ok{color:oklch(.5 .12 155)}
.kropka:empty{display:none}
.zwin{min-width:44px;min-height:44px;border:0;background:transparent;color:#a09c92;font-size:15px;margin:-10px -9px 0 0;padding:0}

/* serie: nr | kg | powt. | RPE | ✓ | ✕ — pola 44 px, font 16 px (Safari
   powiększa stronę przy fokusie w polu z mniejszą czcionką) */
.serie{margin-top:10px}
.sh,.sr{display:grid;grid-template-columns:18px minmax(0,1.15fr) minmax(0,1fr) minmax(0,.8fr) 44px 44px;gap:6px;align-items:center}
.sh{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#a09c92;padding:0 0 4px}
.sh span{text-align:center}
.sr{margin-bottom:6px}
.nr{font-size:13px;font-weight:700;color:#8a867c;text-align:center;font-variant-numeric:tabular-nums}
.pole{display:block;width:100%;height:44px;border:1px solid #e3e0d8;border-radius:10px;background:#fdfdfb;font-size:16px;font-weight:600;text-align:center;padding:0 4px;font-variant-numeric:tabular-nums;-webkit-appearance:none;appearance:none;outline:none}
.pole:focus{border-color:#e8c96a;box-shadow:0 0 0 2px #f6e8bd;background:#fff}
.pole::placeholder{color:#c3c0b8;font-weight:500}
.btn-ok,.btn-nie{width:44px;height:44px;border-radius:10px;border:1px solid #d8d5cc;background:#fff;font-size:19px;font-weight:700;padding:0;display:inline-flex;align-items:center;justify-content:center;color:#6f6b61}
.sr.ok .btn-ok{background:#1c1b18;border-color:#1c1b18;color:#fff}
.sr.ok .pole{border-color:#cfccc3;background:#fff}
.sr.skip .btn-nie{background:#fdf3f2;border-color:#e5c3bd;color:#c0392b}
.sr.skip .pole{opacity:.45}
.akcje{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.akcja{min-height:44px;padding:0 14px;border:1px dashed #d8d5cc;border-radius:10px;background:transparent;font-size:14px;font-weight:600;color:#6f6b61}
.nota{display:block;width:100%;margin-top:8px;min-height:44px;border:1px solid #e3e0d8;border-radius:10px;background:#fdfdfb;font-size:16px;padding:10px 12px;resize:none;overflow:hidden;line-height:1.35;outline:none}
.nota:focus{border-color:#e8c96a;box-shadow:0 0 0 2px #f6e8bd;background:#fff}
.odrz{margin-top:8px;font-size:13px;font-weight:600;color:#a33b2c;background:#fdf3f2;border-radius:8px;padding:8px 10px}
/* zmiana rozpiski z telefonu: zamień / usuń / + ćwiczenie (Filip 2026-09-28) */
.wiecej{min-width:44px;min-height:44px;margin-left:auto;padding:0 10px;border:1px dashed #d8d5cc;border-radius:10px;background:transparent;font-size:18px;font-weight:700;color:#6f6b61;letter-spacing:.1em}
.edycja{margin-top:8px;padding:10px;border:1px solid #ebe9e2;border-radius:12px;background:#faf9f6}
.edycja .tyt{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#a09c92;margin:0 0 6px}
.edp{display:block;width:100%;height:44px;border:1px solid #e3e0d8;border-radius:10px;background:#fff;font-size:16px;padding:0 12px;margin-bottom:6px;-webkit-appearance:none;appearance:none;outline:none}
.edp:focus{border-color:#e8c96a;box-shadow:0 0 0 2px #f6e8bd}
.edp::placeholder{color:#c3c0b8}
.edbtn{display:flex;gap:6px;flex-wrap:wrap}
.edbtn button{min-height:44px;padding:0 14px;border-radius:10px;border:1px solid #d8d5cc;background:#fff;font-size:14px;font-weight:700;color:#1c1b18}
.edbtn .glowny{background:#1c1b18;border-color:#1c1b18;color:#fff}
.edbtn .usun{color:#c0392b;border-color:#e5c3bd}
.edbtn .usun.pewny{background:#c0392b;border-color:#c0392b;color:#fff}
.edbtn .anuluj{border-style:dashed;color:#6f6b61}
.dodajcw{width:100%;min-height:44px;margin:0 0 10px;border:1px dashed #d8d5cc;border-radius:12px;background:transparent;font-size:14px;font-weight:600;color:#6f6b61}

/* zwinięta sekcja (Prep, Plyo): jeden wiersz na ćwiczenie */
.mini{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;background:#fff;border:1px solid #ebe9e2;border-radius:14px;padding:9px 12px;margin:0 0 8px;text-align:left;overflow:hidden}
.mini.zrobione{background:#f7faf5;border-color:#d9e6d3}
.mini .minibtn{display:flex;align-items:center;gap:12px;flex:1;min-width:0;min-height:44px;border:0;background:transparent;padding:0;text-align:left}
.mini .ost{font-size:12.5px}
.mini .chevo{min-width:44px;min-height:44px;margin:-9px -12px -9px 0;border:0;border-left:1px solid #f0eee8;background:transparent;color:#a09c92;font-size:16px}
.mini .fajka{width:26px;height:26px;border-radius:999px;border:1px solid #d8d5cc;display:inline-flex;align-items:center;justify-content:center;font-size:14px;color:transparent;flex-shrink:0}
.mini.zrobione .fajka{background:#1c1b18;border-color:#1c1b18;color:#fff}
.akcja.nota-btn.jest{border-style:solid;color:#1c1b18}
.mdose{font-size:13px;font-weight:600;color:#6f6b61;font-variant-numeric:tabular-nums}
.licz{font-size:13px;font-weight:700;color:#8a867c;white-space:nowrap;font-variant-numeric:tabular-nums}
.licz.pelny{color:oklch(.5 .12 155)}

.pasek{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;font-weight:600;border-radius:12px;padding:4px 4px 4px 12px;margin:4px 0 8px;background:#fdf6e3;color:#7a5b16;border:1px solid #ecdfc4}
.pasek.blad{background:#fdf3f2;color:#a33b2c;border-color:#e5c3bd}
.pasek button{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid currentColor;background:#fff;color:inherit;font-weight:700;font-size:14px}
.stopka{margin:18px 0 4px}
.zakoncz{width:100%;min-height:52px;border:0;border-radius:999px;background:#1c1b18;color:#fff;font-size:16px;font-weight:700}
.zakoncz[disabled]{opacity:.55}
.zapisany{font-size:15px;font-weight:700;text-align:center;color:oklch(.45 .12 155);padding:8px 0 2px}
.maly{font-size:12.5px;color:#8a867c;text-align:center}
.pusto{font-size:14px;color:#8a867c;padding:12px 0}
#lista.czeka{pointer-events:none;opacity:.5}
@media (max-width:340px){
  .karta{padding:10px 8px}
  .sh,.sr{gap:4px;grid-template-columns:14px minmax(0,1.15fr) minmax(0,1fr) minmax(0,.8fr) 44px 44px}
}
</style>
</head>
<body>
<div id="root"><div id="pasek" class="pasek" hidden></div><div id="lista"></div><div id="stopka" class="stopka"></div></div>
<script>
/* ---------------------------------------------------------------- protokół Streamlit
   Plain-JS component (bez Node i buildu). Kontrakt argumentów i operacji:
   views/trener_panel.py. Python: vald/ui_training.py → _trk_konsumuj
   (wartość konsumowana PRZED renderem) → _trk_zastosuj → _TRK_OPY.

   Każda wysyłka niesie WSZYSTKIE niepotwierdzone operacje (kolejka), a
   operacja „cwiczenie" to PEŁNY stan jednego ćwiczenia w tygodniu — więc
   ponowienie niczego nie psuje. Python odsyła `ack` (id zapisanych); do tego
   czasu karta trzyma stan z telefonu i echo nie nadpisuje świeżych wpisów. */
// IID: po przeładowaniu ramki licznik startuje od zera, a Python pamięta
// ostatni seq — bez IID pierwsza wysyłka nowej ramki zostałaby pominięta
const IID = Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
let N = 0;
const nowyId = () => IID + "-" + (++N);
const POST = (m) => parent.postMessage(Object.assign({ isStreamlitMessage: true }, m), "*");
const READY = () => POST({ type: "streamlit:componentReady", apiVersion: 1 });
const SETH = (h) => POST({ type: "streamlit:setFrameHeight", height: h });

const LS = "aph.trk.outbox";      // kolejka przeżywa zablokowany telefon i restart serwera
const TTL = 12 * 3600 * 1000;     // starszych wpisów nie wysyłam (mogłyby nadpisać nowsze)
const ZAPISANE_MS = 2500;         // jak długo karta pokazuje „✓ zapisane"
const PASEK_MS = 1500;            // pasek „czeka na zapis" dopiero po tym czasie
const PONOW_MS = 10000;           // ponowienie niepotwierdzonej kolejki
const ZWLOKA_MS = 600;            // wysyłka poprawki pola po jego opuszczeniu

const S = {
  ctx: null, sekcje: [], karty: [], status: {},
  fp: null, odlozone: null, gotowy: false,
  stan: {},      // klucz karty → {serie:[{kg,reps,rpe,stan}], notatka, notZm}
  meta: {},      // klucz karty → karta z Pythona (także z innego treningu/tygodnia)
  metaCtx: {},   // klucz karty → ctx, z którego pochodzi
  brudne: {},    // klucz karty → wpisane, jeszcze nie w kolejce
  ile: {},       // klucz karty → liczba wierszy ustawiona przez + / − seria
  otwarte: {}, sekOtw: {}, notOtw: {},
  nazwy: [],     // Baza ćwiczeń — podpowiedzi przy zamianie / dodaniu
  ed: {},        // klucz karty → {nowe, dawka, pewny} (formularz zamiany)
  dod: {},       // sekcja → {nowe, dawka} (formularz „+ ćwiczenie")
  odrzSek: {},   // sekcja → powód odrzucenia dodania
  kolejka: {},   // miejsce („c|plan|sesja|tydz|i", „k|plan|sesja|tydz") → operacja
  zapisane: {}, odrz: {}, odrzKoniec: "", blad: "",
  wcisniety: false, ostWys: 0, tWys: null,
};
const root = document.getElementById("root");

/* ---------------------------------------------------------------- pomocnicze */
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const txt = (v) => String(v == null ? "" : v).trim();
const ctxKlucz = (c) => (c ? `${c.plan_id}|${c.sess_id}|${c.wk}` : "");
const kl = (karta) => ctxKlucz(S.ctx) + "|" + karta.i;
const miejsceOp = (op) => op.typ === "usun" || op.typ === "dodaj" || op.typ === "zamien"
  ? miejsceEd(op)
  : (op.typ === "koniec" ? "k|" : "c|") + ctxKlucz(op) + (op.typ === "koniec" ? "" : "|" + op.i);
const kartaOp = (op) => ctxKlucz(op) + "|" + op.i;
const oczekujace = () => Object.keys(S.kolejka).length;
const TYPY = new Set(["cwiczenie", "koniec", "usun", "dodaj", "zamien"]);
const EDYCJE = new Set(["usun", "dodaj", "zamien"]);
// zmiana rozpiski tego treningu czeka na zapis — do potwierdzenia lista jest
// zablokowana: klucz karty to indeks, a po zapisie indeksy się przesuwają,
// więc wpis zrobiony w międzyczasie trafiłby do innego ćwiczenia (przegląd 2026-09-28)
const edycjaCzeka = () => !!S.ctx && Object.values(S.kolejka).some(
  (op) => EDYCJE.has(op.typ) && ctxKlucz(op) === ctxKlucz(S.ctx));
// zmiana rozpiski: własne miejsce w kolejce (nie zastępuje wpisów serii)
const miejsceEd = (op) => "e|" + op.id;

function kopiaSerii(serie) {
  return (serie || []).map((s) => ({ kg: txt(s && s.kg), reps: txt(s && s.reps),
    rpe: txt(s && s.rpe), stan: (s && s.stan) || "" }));
}
function zSerwera(karta) {
  return { serie: kopiaSerii(karta.serie), notatka: txt(karta.notatka), notZm: false };
}
function zOp(op, karta) {
  return { serie: kopiaSerii(op.serie),
    notatka: op.notatka == null ? txt(karta.notatka) : String(op.notatka),
    notZm: op.notatka != null };
}
function seria(st, si) {
  while (st.serie.length <= si) st.serie.push({ kg: "", reps: "", rpe: "", stan: "" });
  return st.serie[si];
}
function przytnij(st) {
  const pusta = (s) => !(txt(s.kg) || txt(s.reps) || txt(s.rpe) || s.stan);
  while (st.serie.length && pusta(st.serie[st.serie.length - 1])) st.serie.pop();
}
// wierszy: tyle, ile rozpisał trener (albo ustawił + / −), nigdy mniej niż wpisanych
function ileWierszy(k) {
  const karta = S.meta[k], st = S.stan[k];
  const n0 = S.ile[k] != null ? S.ile[k] : Math.max(+karta.n_plan || 1, 1);
  return Math.max(n0, st.serie.length, 1);
}
const stanW = (st, si) => (st.serie[si] || {}).stan || "";
function ileOk(k) {
  const st = S.stan[k], n = ileWierszy(k);
  let o = 0;
  for (let si = 0; si < n; si++) if (stanW(st, si) === "ok") o++;
  return o;
}
function rozstrzygnieta(k) {
  const st = S.stan[k], n = ileWierszy(k);
  for (let si = 0; si < n; si++) if (!stanW(st, si)) return false;
  return true;
}
function poprzednia(st, si, f) {
  for (let j = si - 1; j >= 0; j--) {
    const s = st.serie[j];
    if (s && s.stan !== "skip" && txt(s[f])) return txt(s[f]);
  }
  return "";
}
// powtórzenia do jednego stuknięcia ✓: z rozpiski, gdy jednoznaczna („7",
// „6, 6, 6" — Python daje je w reps_plan), inaczej z poprzedniej serii;
// przy „8-12" bez poprzedniej — puste (dolna granica byłaby zmyślona)
function repsDoWstawienia(k, si) {
  const karta = S.meta[k];
  return txt((karta.reps_plan || [])[si]) || poprzednia(S.stan[k], si, "reps");
}
// jedno stuknięcie ✓: powt. jak wyżej, kg z poprzedniej serii tej karty
// (pierwszą trener wpisuje sam), RPE nigdy samo. Drugie ✓ cofa — liczby zostają.
function odhacz(k, si) {
  const s = seria(S.stan[k], si);
  if (s.stan === "ok") { s.stan = ""; return; }
  s.stan = "ok";
  if (!txt(s.reps)) s.reps = repsDoWstawienia(k, si);
  if (!txt(s.kg)) s.kg = poprzednia(S.stan[k], si, "kg");
}
function pomin(k, si) {
  const s = seria(S.stan[k], si);
  s.stan = s.stan === "skip" ? "" : "skip";
}
// podpowiedź powtórzeń w polu: element listy dla tej serii („5+5, 5+5" → „5+5");
// długi opis („last week: @ 70, …", „25-30 sec ISO") zostaje tylko w dawce nad
// seriami — w polu 50–70 px byłby uciętym „last wee"
function hintReps(karta, si) {
  const r = txt(karta.reps_hint), czesci = r.split(",").map(txt);
  const h = czesci.length > 1 ? (czesci[si] || "") : r;
  return h.length <= 7 ? h : "";
}
// szare podpowiedzi = to, co wstawi ✓; kg pierwszej serii i zakres powtórzeń
// to tylko przypomnienie. W serii odhaczonej pusto znaczy pusto.
function podpowiedzi(k, si) {
  const karta = S.meta[k], st = S.stan[k], s = st.serie[si] || {};
  if (s.stan) return { kg: "", reps: "", rpe: "" };
  return { kg: si === 0 ? txt(karta.kg_hint) : poprzednia(st, si, "kg"),
    reps: repsDoWstawienia(k, si) || hintReps(karta, si), rpe: "" };
}
function wpisy(n) {
  const d = n % 10, s = n % 100;
  if (n === 1) return "1 wpis czeka na zapis";
  if (d >= 2 && d <= 4 && !(s >= 12 && s <= 14)) return `${n} wpisy czekają na zapis`;
  return `${n} wpisów czeka na zapis`;
}

/* ---------------------------------------------------------------- kolejka i wysyłka */
function zapiszLS() {
  try {
    const ops = Object.values(S.kolejka);
    if (ops.length) localStorage.setItem(LS, JSON.stringify(ops));
    else localStorage.removeItem(LS);
  } catch (e) { /* prywatne okno / blokada — kolejka zostaje w pamięci */ }
}
function wczytajLS() {
  try {
    const ops = JSON.parse(localStorage.getItem(LS) || "[]"), teraz = Date.now();
    if (!Array.isArray(ops)) return;
    for (const op of ops) {
      if (op && op.id && TYPY.has(op.typ)
          && teraz - (+op.t || 0) < TTL) S.kolejka[miejsceOp(op)] = op;
    }
  } catch (e) { /* uszkodzony wpis — pomijam */ }
}
function kolejkuj(k) {
  const karta = S.meta[k], st = S.stan[k], c = S.metaCtx[k];
  if (!karta || !st || !c) return;
  const op = { id: nowyId(), typ: "cwiczenie", t: Date.now(),
    plan_id: c.plan_id, sess_id: c.sess_id, wk: c.wk,
    i: karta.i, exercise: karta.exercise || "",
    serie: kopiaSerii(st.serie),
    // null = notatki nie ruszam (nie nadpisuję wpisu zawodnika starszą wersją)
    notatka: st.notZm ? String(st.notatka || "") : null };
  S.kolejka[miejsceOp(op)] = op;   // nowsza wersja ćwiczenia zastępuje starszą
  S.brudne[k] = false;
  zapiszLS();
  aktualizujKropki();
}
function splucz() {
  let jest = false;
  for (const k of Object.keys(S.brudne)) if (S.brudne[k]) { kolejkuj(k); jest = true; }
  return jest;
}
function SEND() {
  clearTimeout(S.tWys);
  const ops = Object.values(S.kolejka);
  if (!ops.length || !S.gotowy) return;
  S.ostWys = Date.now();
  POST({ type: "streamlit:setComponentValue",
    value: { seq: nowyId(), iid: IID, ops }, dataType: "json" });
  aktualizujPasek();

      if (!txt(ed.nowe)) { fokus(`input.edp[data-k="${CSS.escape(k)}"][data-ed="nowe"]`); return; }
      zdejmijFokus();

        sess_id: c.sess_id, wk: c.wk, i: karta.i, exercise: karta.exercise || "",
        nowe: txt(ed.nowe), dawka: txt(ed.dawka) });

    }
    case "usun": {
      const ed = S.ed[k], karta = S.meta[k], c = S.metaCtx[k];
      if (!ed || !karta) return;

      zdejmijFokus();
      S.ed[k] = null;

      kolejkujEd({ id: nowyId(), typ: "usun", t: Date.now(), plan_id: c.plan_id,
        sess_id: c.sess_id, wk: c.wk, i: karta.i, exercise: karta.exercise || "" });
      break;
    }
    case "dodaj_otworz":
      zdejmijFokus();
      S.dod[s] = { nowe: "", dawka: "" };
      S.odrzSek[s] = "";
      render();
      fokus(`input.edp[data-s="${CSS.escape(s)}"][data-ed="nowe"]`);

    case "dodaj_anuluj":
      S.dod[s] = null;
      render();
      break;
    case "dodaj": {
      const d = S.dod[s], c = S.ctx;
      if (!d || !c) return;
      if (!txt(d.nowe)) { fokus(`input.edp[data-s="${CSS.escape(s)}"][data-ed="nowe"]`); return; }
      zdejmijFokus();
      S.dod[s] = null;
      S.odrzSek[s] = "";
      kolejkujEd({ id: nowyId(), typ: "dodaj", t: Date.now(), plan_id: c.plan_id,
        sess_id: c.sess_id, wk: c.wk, section: s, nowe: txt(d.nowe), dawka: txt(d.dawka) });
      break;
    }
  }
  sprobujOdlozone();
});
