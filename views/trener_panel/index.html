<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<!-- w ramce Streamlita szerokość i tak daje iframe; meta przydaje się,
     gdy plik otwiera test na emulowanym telefonie (inaczej układ 980 px) -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* ten sam adres co w app.py — arkusz fontu jest już w pamięci przeglądarki */
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Archivo:wght@400;500;600;700;900&display=swap');
/* Tryb trenera na telefonie — serie do wpisania. Wygląd kółek i sekcji jak
   w widoku zawodnika (vald/ui_training.py → _PV_CSS), BEZ linków do filmów:
   „mogą być te kółka, tylko nie musisz mieć linków" (Filip 2026-09-27).
   Bez position:fixed/sticky i bez vh — ramka ma wysokość treści
   (setFrameHeight), więc „ekran" wewnątrz niej nie istnieje (CLAUDE.md). */
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0;background:transparent;color:#1c1b18;
  font-family:'Archivo',-apple-system,"Segoe UI",system-ui,sans-serif;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;
  touch-action:manipulation}
button,input,textarea{font-family:inherit;color:inherit;margin:0}
button{cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
/* flow-root: marginesy dzieci liczą się do wysokości ramki (setFrameHeight) */
#root{display:flow-root;padding:0 max(0px,env(safe-area-inset-right)) 12px max(0px,env(safe-area-inset-left))}

/* kółko, nazwa, dawka — rozmiary 1:1 z _PV_CSS (pilnuje test_kontrakt_ui) */
.pvslot{width:32px;height:32px;border-radius:999px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.pvname{font-size:16px;font-weight:700;color:#1c1b18;overflow-wrap:anywhere}
.pvdose{font-size:15px;font-weight:700;color:#1c1b18;font-variant-numeric:tabular-nums}
.pvintent{white-space:nowrap;display:inline-block;font-size:12px;font-weight:600;color:oklch(.5 .13 60);background:oklch(.96 .04 75);border-radius:6px;padding:2px 8px;vertical-align:1px;margin-left:2px}
.pvcol{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.pvsec{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin:16px 0 8px}
.pvsec i{display:inline-block;width:4px;height:15px;border-radius:2px;flex-shrink:0}
.sektyt,.sekbtn{display:inline-flex;align-items:center;gap:8px;min-height:44px}
.sekbtn{border:0;background:transparent;padding:0 8px 0 0;font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit}
.chev{font-size:11px;opacity:.7}
.wszystko{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid currentColor;background:#fff;font-size:14px;font-weight:700;letter-spacing:0;text-transform:none;color:inherit;white-space:nowrap}

/* karta ćwiczenia */
.karta{background:#fff;border:1px solid #ebe9e2;border-radius:14px;padding:12px 12px 10px;margin:0 0 10px}
.glowa{display:flex;gap:12px;align-items:flex-start}
.ost{font-size:13px;color:#54514a;font-variant-numeric:tabular-nums}
.det{font-size:12.5px;color:#8a867c}
.kropka{font-size:11.5px;font-weight:600;color:#a09c92;white-space:nowrap;padding-top:3px}
.kropka.ok{color:oklch(.5 .12 155)}
.kropka:empty{display:none}
.wroc{display:inline-flex;align-items:center;gap:2px;min-height:40px;margin:-8px 0 2px -8px;padding:0 12px 0 6px;border:0;border-radius:999px;background:transparent;color:#2563eb;font-size:15px;font-weight:700}
.wroc b{font-size:22px;font-weight:600;line-height:1;margin-top:-2px}

/* serie: nr | kg | powt. | RPE | ✓ | ✕ — pola 44 px, font 16 px (Safari
   powiększa stronę przy fokusie w polu z mniejszą czcionką) */
.serie{margin-top:10px}
.sh,.sr{display:grid;grid-template-columns:18px minmax(0,1.15fr) minmax(0,1fr) minmax(0,.8fr) 44px 44px;gap:6px;align-items:center}
.sh{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#a09c92;padding:0 0 4px}
.sh span{text-align:center}
.sr{margin-bottom:6px}
.nr{font-size:13px;font-weight:700;color:#8a867c;text-align:center;font-variant-numeric:tabular-nums}
.pole{display:block;width:100%;height:44px;border:1px solid #e3e0d8;border-radius:10px;background:#fdfdfb;font-size:16px;font-weight:600;text-align:center;padding:0 4px;font-variant-numeric:tabular-nums;-webkit-appearance:none;appearance:none;outline:none}
.pole:focus{border-color:#e8c96a;box-shadow:0 0 0 2px #f6e8bd;background:#fff}
.pole::placeholder{color:#c3c0b8;font-weight:500}
.btn-ok,.btn-nie{width:44px;height:44px;border-radius:10px;border:1px solid #d8d5cc;background:#fff;font-size:19px;font-weight:700;padding:0;display:inline-flex;align-items:center;justify-content:center;color:#6f6b61}
.sr.ok .btn-ok{background:#1c1b18;border-color:#1c1b18;color:#fff}
.sr.ok .pole{border-color:#cfccc3;background:#fff}
.sr.skip .btn-nie{background:#fdf3f2;border-color:#e5c3bd;color:#c0392b}
.sr.skip .pole{opacity:.45}
.akcje{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.akcja{min-height:44px;padding:0 12px;white-space:nowrap;border:1px dashed #d8d5cc;border-radius:10px;background:transparent;font-size:14px;font-weight:600;color:#6f6b61}
.nota{display:block;width:100%;margin-top:8px;min-height:44px;border:1px solid #e3e0d8;border-radius:10px;background:#fdfdfb;font-size:16px;padding:10px 12px;resize:none;overflow:hidden;line-height:1.35;outline:none}
.nota:focus{border-color:#e8c96a;box-shadow:0 0 0 2px #f6e8bd;background:#fff}
.odrz{margin-top:8px;font-size:13px;font-weight:600;color:#a33b2c;background:#fdf3f2;border-radius:8px;padding:8px 10px}
/* zmiana rozpiski z telefonu: zamień / usuń / + ćwiczenie (Filip 2026-09-28) */
.wiecej{min-width:44px;min-height:44px;margin-left:auto;padding:0 10px;border:1px dashed #d8d5cc;border-radius:10px;background:transparent;font-size:18px;font-weight:700;color:#6f6b61;letter-spacing:.1em}
.edycja{margin-top:8px;padding:10px;border:1px solid #ebe9e2;border-radius:12px;background:#faf9f6}
.edycja .tyt{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#a09c92;margin:0 0 6px}
.edp{display:block;width:100%;height:44px;border:1px solid #e3e0d8;border-radius:10px;background:#fff;font-size:16px;padding:0 12px;margin-bottom:6px;-webkit-appearance:none;appearance:none;outline:none}
.edp:focus{border-color:#e8c96a;box-shadow:0 0 0 2px #f6e8bd}
.edp::placeholder{color:#c3c0b8}
.edbtn{display:flex;gap:6px;flex-wrap:wrap}
.edbtn button{min-height:44px;padding:0 14px;border-radius:10px;border:1px solid #d8d5cc;background:#fff;font-size:14px;font-weight:700;color:#1c1b18}
.edbtn .glowny{background:#1c1b18;border-color:#1c1b18;color:#fff}
.edbtn .usun{color:#c0392b;border-color:#e5c3bd}
.edbtn .usun.pewny{background:#c0392b;border-color:#c0392b;color:#fff}
.edbtn .anuluj{border-style:dashed;color:#6f6b61}
.dodajcw{width:100%;min-height:44px;margin:0 0 10px;border:1px dashed #d8d5cc;border-radius:12px;background:transparent;font-size:14px;font-weight:600;color:#6f6b61}

/* zwinięta sekcja (Prep, Plyo): jeden wiersz na ćwiczenie */
.mini{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;background:#fff;border:1px solid #ebe9e2;border-radius:14px;padding:9px 12px;margin:0 0 8px;text-align:left;overflow:hidden}
/* stan ćwiczenia na liście (Filip 2026-10-01): zielony = wszystkie serie,
   pomarańcz = część, czerwony = nic nie zrobione, same ✕ */
.mini.zrobione{background:#f1f8ee;border-color:#cfe3c6}
.mini.czesc{background:#fffaf1;border-color:#f0d6ab}
.mini.pominiete{background:#fdf4f3;border-color:#efc9c3}
.mini .minibtn{display:flex;align-items:center;gap:12px;flex:1;min-width:0;min-height:44px;border:0;background:transparent;padding:0;text-align:left}
.mini .ost{font-size:12.5px}
.mini .chevo{min-width:44px;min-height:44px;margin:-9px -12px -9px 0;border:0;border-left:1px solid #f0eee8;background:transparent;color:#a09c92;font-size:16px}
.mini .fajka{width:26px;height:26px;border-radius:999px;border:1px solid #d8d5cc;display:inline-flex;align-items:center;justify-content:center;font-size:14px;color:transparent;flex-shrink:0}
.mini.zrobione .fajka{background:#3f9a50;border-color:#3f9a50;color:#fff}
.akcja.nota-btn.jest{border-style:solid;border-color:#bcd0f7;background:#eef4ff;color:#2453b8}
.mdose{font-size:13px;font-weight:600;color:#6f6b61;font-variant-numeric:tabular-nums}
.licz{font-size:13px;font-weight:700;color:#8a867c;white-space:nowrap;font-variant-numeric:tabular-nums}
.licz.pelny{color:#3f9a50}
.licz.czesc{color:#c46a0c}
.licz.pominiete{color:#c0392b}
/* notatka przy ćwiczeniu — widać ją na liście (Filip 2026-10-01) */
.notznak{display:inline-flex;align-items:center;justify-content:center;margin-left:6px;padding:1px 7px;border-radius:999px;background:#e8f0fe;color:#2453b8;font-size:12px;font-weight:700;vertical-align:2px}
/* ciężar z poprzedniej serii: mały przycisk wewnątrz pola kg */
.kgpole{position:relative;display:block;min-width:0}
.kopiuj{position:absolute;top:5px;right:4px;bottom:5px;width:28px;border:0;border-radius:7px;background:#f1efe9;color:#8a867c;display:flex;align-items:center;justify-content:center;padding:0}
/* „Cofnij wszystko” z potwierdzeniem */
.potw{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:-2px 0 10px;padding:8px 8px 8px 12px;border:1px solid #efc9c3;border-radius:12px;background:#fdf4f3;font-size:14px;font-weight:600;color:#7a2e24}
.potw span{flex:1;min-width:160px}
.potw button{min-height:40px;padding:0 16px;border-radius:999px;border:1px solid #e5a9a0;background:#fff;color:#a33b2c;font-weight:700;font-size:14px}
.potw button.tak{background:#c0392b;border-color:#c0392b;color:#fff}

.pasek,.edczeka{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;font-weight:600;border-radius:12px;padding:4px 4px 4px 12px;margin:4px 0 8px;background:#fdf6e3;color:#7a5b16;border:1px solid #ecdfc4}
.edczeka{font-size:14px;font-weight:600;border-radius:12px;padding:4px 4px 4px 12px;background:#fdf6e3;color:#7a5b16;border:1px solid #ecdfc4}
.pasek.blad{background:#fdf3f2;color:#a33b2c;border-color:#e5c3bd}
.pasek button,.edczeka button{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid currentColor;background:#fff;color:inherit;font-weight:700;font-size:14px}
.stopka{margin:18px 0 4px}
.zakoncz{width:100%;min-height:52px;border:0;border-radius:999px;background:#1c1b18;color:#fff;font-size:16px;font-weight:700}
.zakoncz[disabled]{opacity:.55}
.film{display:inline-flex;align-items:center;min-height:36px;color:#2563eb;text-decoration:none;font-size:14px;font-weight:700;align-self:flex-start}
.uwznak{color:#2563eb;font-size:14px;font-weight:700}
/* kółeczko = osobny przycisk: cel 44 px, widoczne koło 30 px */
.mini button.fajka{position:relative;flex:none;width:44px;height:44px;min-width:44px;margin:-8px -6px -8px 0;padding:0;border:0;background:transparent;color:transparent;font-size:0;cursor:pointer}
.mini button.fajka::before{content:"✓";position:absolute;left:7px;top:7px;width:30px;height:30px;box-sizing:border-box;border-radius:999px;border:1.5px solid #cfcbc1;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:transparent;background:#fff}
.mini.zrobione button.fajka::before{background:#3f9a50;border-color:#3f9a50;color:#fff}
.mini.czesc button.fajka::before{border-color:#e3a14a;color:#e3a14a}
.mini.pominiete button.fajka::before{content:"✕";border-color:#e5a9a0;color:#c0392b}
.ost.hist{border:0;background:transparent;padding:0;text-align:left;font:inherit;font-size:13px;color:#54514a;min-height:32px;cursor:pointer}
.karta{position:relative}
.odstep{height:14px}
.etapy{display:flex;gap:6px;margin:-2px 0 12px}
.etap{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:5px}
.etap i{display:block;height:5px;border-radius:5px;background:#ebe9e2;overflow:hidden}
.etap i b{display:block;height:100%;background:var(--acc)}
.etap span{font-size:11px;font-weight:700;color:#a09c92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.etap.teraz span{color:var(--acc)}
.etap.zrob span{color:#54514a}
.krok{background:#fff;border:1px solid #ebe9e2;border-radius:16px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:6px}
.krok.nast{border-style:dashed}
.kdalej{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#8a867c}
.kgora{display:flex;align-items:center;gap:8px}
.kser{margin-left:auto;font-size:13px;font-weight:700;color:#1c1b18;background:#f1efe9;border-radius:999px;padding:4px 10px}
.knazwa{font-size:22px;font-weight:750;letter-spacing:-.01em;line-height:1.2}
.kdawka{font-size:15px;font-weight:600;color:#54514a;font-variant-numeric:tabular-nums}
.kpola{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:6px}
.kpola label{display:flex;flex-direction:column;gap:3px}
.kpola label span{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#a09c92;text-align:center}
.kprzyciski{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.kok{min-height:56px;border:0;border-radius:999px;background:#1c1b18;color:#fff;font-size:18px;font-weight:700}
.knie{min-height:44px;border:1px solid #e5c3bd;border-radius:999px;background:#fff;color:#a33b2c;font-size:14px;font-weight:700}
.kkoniec{text-align:center;font-size:18px;font-weight:700;padding:28px 0 8px}
.przerwa{display:flex;flex-direction:column;align-items:center;gap:10px;padding:6px 0 14px;--kol:#8fb4ea;--kolt:#4f7fc4;--tlo:#e8f0fb}
.przerwa.czerw{--kol:#e0655a;--kolt:#c8443a;--tlo:#fbe9e7}
.ring{position:relative;width:190px;height:190px}
.ring svg{width:100%;height:100%}
.rtlo{fill:none;stroke:var(--tlo);stroke-width:8;transition:stroke .3s}
.rpost{fill:none;stroke:var(--kol);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .2s linear,stroke .3s}
.rczas{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:46px;font-weight:750;font-variant-numeric:tabular-nums;color:var(--kolt);transition:color .3s}
.rpasek{width:80%;height:8px;border-radius:8px;background:var(--tlo);overflow:hidden;transition:background .3s}
.rpasek i{display:block;height:100%;width:100%;background:var(--kol);transition:width .2s linear,background .3s}
.rprzyciski{display:flex;gap:8px}
.rprzyciski button{min-height:44px;padding:0 18px;border-radius:999px;border:1px solid #d8d5cc;background:#fff;font-size:14px;font-weight:700;color:#1c1b18}
.rprzyciski .pom{background:#1c1b18;border-color:#1c1b18;color:#fff}
.start{display:block;width:100%;min-height:52px;margin:2px 0 14px;border:0;border-radius:999px;background:#1c1b18;color:#fff;font-size:16px;font-weight:700}
.trbar{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#8a867c}
.trbar button{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid #d8d5cc;background:#fff;font-size:13px;font-weight:700;letter-spacing:0;text-transform:none;color:#6f6b61}
.trtyt{display:flex;flex-direction:column;align-items:center;min-width:0;line-height:1.15;letter-spacing:0;text-transform:none}
.trtyt b{font-size:19px;font-weight:750;letter-spacing:-.01em;color:#1c1b18;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.trtyt span{margin-top:2px;font-size:12.5px;font-weight:600;color:#8a867c;font-variant-numeric:tabular-nums}
.trbar .wstecz{padding:0 14px 0 10px;color:#2563eb;border-color:#cfdcf5}
.trbar .wstecz b{font-size:19px;font-weight:600;line-height:1;margin-right:3px}
.trbar .wstecz[disabled]{opacity:.35}
.mini.cel{border-color:#e8c96a;box-shadow:0 0 0 2px #f6e8bd}
.sr.cel{background:#fdf6e3;border-radius:10px;box-shadow:0 0 0 2px #f6e8bd}
.uw{min-width:40px;min-height:44px;border:0;background:transparent;color:#2563eb;font-size:17px;flex:none;padding:0}
.uw.otw{color:#1c1b18}
.mini .uw{margin:-9px 0}
.uwmini{margin:-4px 0 10px;padding:8px 12px;border-radius:10px;background:#f1f5fd;color:#2b3a55;font-size:13.5px;line-height:1.4}
.uwagi{display:block;margin:6px 0 2px;padding:10px 12px 10px 13px;border-left:3px solid #6f9cf0;border-radius:4px 12px 12px 4px;background:#f1f5fd;color:#1f2a44;font-size:15px;font-weight:500;line-height:1.45}
.uwagi ul{margin:0;padding-left:17px}
.uwagi li+li{margin-top:5px}
.mini .kropka{display:none}
.karta .glowa .kropka{position:absolute;top:2px;right:12px;pointer-events:none}
.ost.hist b{font-weight:700;color:#a09c92}
.histlista{display:flex;flex-direction:column;gap:2px;font-size:12.5px;color:#6f6b61;margin:2px 0 4px;font-variant-numeric:tabular-nums}
.histlista i{font-style:normal;font-weight:700;color:#1c1b18;margin-right:4px}
.akcje.prawo{justify-content:flex-end}
.histbtn{display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;padding:0 12px;border:1px dashed #d8d5cc;border-radius:10px;background:transparent;color:#6f6b61}
.klinki{display:flex;align-items:center;gap:8px}
.klinki .histbtn{margin-left:auto}
/* „Ostatnie treningi” — okienko wysuwane od dołu, na widocznej części ekranu */
#arkusz{position:absolute;left:0;right:0;top:0;z-index:50}
#arkusz[hidden]{display:none}
.atlo{position:absolute;inset:0;background:rgba(28,27,24,.38);animation:afade .18s ease-out}
/* „Ostatnie treningi” — kafelek na środku widocznej części ekranu (Filip 2026-10-01) */
.arkusz{position:absolute;left:12px;right:12px;top:50%;transform:translateY(-50%);max-height:calc(100% - 32px);overflow:auto;overscroll-behavior:contain;background:#faf9f6;border-radius:20px;padding:16px 14px 16px;box-shadow:0 12px 40px rgba(0,0,0,.18);animation:apop .2s cubic-bezier(.2,.8,.2,1)}
.ahead{display:flex;align-items:flex-start;gap:10px;margin:0 2px 14px}
.ahead>div{flex:1;min-width:0}
.aeyebrow{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#a09c92}
.anazwa{font-size:21px;font-weight:750;letter-spacing:-.01em;line-height:1.2;margin-top:3px}
.azamknij{width:40px;height:40px;flex:none;border-radius:999px;border:0;background:#ebe9e2;color:#54514a;font-size:15px;font-weight:700}
.alista{display:flex;flex-direction:column;gap:10px}
.awpis{display:flex;gap:12px;padding:12px;border:1px solid #ebe9e2;border-radius:16px;background:#fff}
.adata{flex:none;width:54px;align-self:center;display:flex;flex-direction:column;align-items:center;padding:7px 0 6px;border-radius:12px;background:var(--tint);color:var(--acc);line-height:1.1}
.adata b{font-size:23px;font-weight:800;font-variant-numeric:tabular-nums}
.adata small{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.awpis.pierwszy .adata{background:var(--acc);color:#fff}
.atresc{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.agora{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-size:12px;color:#8a867c}
.agora b{font-weight:700;color:#54514a;white-space:nowrap}

<body>
<div id="root"><div id="pasek" class="pasek" hidden></div><div id="lista"></div><div id="stopka" class="stopka"></div><div id="arkusz" hidden></div></div>
<script>
/* ---------------------------------------------------------------- protokół Streamlit
   Plain-JS component (bez Node i buildu). Kontrakt argumentów i operacji:
   views/trener_panel.py. Python: vald/ui_training.py → _trk_konsumuj
   (wartość konsumowana PRZED renderem) → _trk_zastosuj → _TRK_OPY.

   Każda wysyłka niesie WSZYSTKIE niepotwierdzone operacje (kolejka), a
   operacja „cwiczenie" to PEŁNY stan jednego ćwiczenia w tygodniu — więc
   ponowienie niczego nie psuje. Python odsyła `ack` (id zapisanych); do tego
   czasu karta trzyma stan z telefonu i echo nie nadpisuje świeżych wpisów. */
// IID: po przeładowaniu ramki licznik startuje od zera, a Python pamięta
// ostatni seq — bez IID pierwsza wysyłka nowej ramki zostałaby pominięta
const IID = Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
let N = 0;
const nowyId = () => IID + "-" + (++N);
const POST = (m) => parent.postMessage(Object.assign({ isStreamlitMessage: true }, m), "*");
const READY = () => POST({ type: "streamlit:componentReady", apiVersion: 1 });
const SETH = (h) => POST({ type: "streamlit:setFrameHeight", height: h });

// kolejka przeżywa zablokowany telefon i restart serwera; link zawodnika ma
// własny klucz na plan — ten sam telefon bywa trenerem i zawodnikiem, a obca
// operacja w kolejce zostałaby odrzucona i przepadła (ustawiane w zastosuj)
let LS = "aph.trk.outbox";
// wpis ma bazę (co telefon widział), serwer scala pole po polu, więc stary wpis
// nie kasuje nowszych cudzych serii; 12 h gubiło trening wpisany bez zasięgu
// i wysłany następnego dnia (audyt KOL-2)
const TTL = 7 * 24 * 3600 * 1000;
const PING_MS = 20000;            // świeże dane (wpisy drugiej strony), gdy nic nie czeka
const MAX_SERII = 20;              // więcej serwer odrzuca w całości (TEL-6)
const ZAPISANE_MS = 2500;         // jak długo karta pokazuje „✓ zapisane"
const PASEK_MS = 1500;            // pasek „czeka na zapis" dopiero po tym czasie
const PONOW_MS = 10000;           // ponowienie niepotwierdzonej kolejki
const ZWLOKA_MS = 600;            // wysyłka poprawki pola po jego opuszczeniu
const PISZ_MS = 1500;             // wysyłka w trakcie pisania po tej przerwie

const S = {
  ctx: null, sekcje: [], karty: [], status: {},
  fp: null, odlozone: null, gotowy: false,
  stan: {},      // klucz karty → {serie:[{kg,reps,rpe,stan}], notatka, notZm}
  meta: {},      // klucz karty → karta z Pythona (także z innego treningu/tygodnia)
  metaCtx: {},   // klucz karty → ctx, z którego pochodzi
  brudne: {},    // klucz karty → wpisane, jeszcze nie w kolejce
  ile: {},       // klucz karty → liczba wierszy ustawiona przez + / − seria
  otwarte: {}, sekOtw: {}, notOtw: {},
  nazwy: [],     // Baza ćwiczeń — podpowiedzi przy zamianie / dodaniu
  ed: {},        // klucz karty → {nowe, dawka, pewny} (formularz zamiany)
  dod: {},       // sekcja → {nowe, dawka} (formularz „+ ćwiczenie")
  odrzSek: {},   // sekcja → powód odrzucenia dodania
  kolejka: {},   // miejsce („c|plan|sesja|tydz|i", „k|plan|sesja|tydz") → operacja
  zapisane: {}, odrz: {}, odrzKoniec: "", blad: "",
  wcisniety: false, ostWys: 0, tWys: null, tKrok: 0, doDomkniecia: new Set(), domknijCzeka: false, potwCofnij: null,
  rola: "trener",  // „zawodnik” = link zawodnika: bez zmian rozpiski, z filmami
  baza: {},        // klucz karty → serie z serwera, od których zaczął telefon
  notBaza: {},     // klucz karty → notatka z serwera, od której zaczął telefon
  odrzNazwa: {},   // klucz karty → ćwiczenie odrzuconego wpisu
  otwNazwy: {},    // ctx → nazwy otwartych kart sprzed zmiany rozpiski
  uwOtw: {},       // klucz karty → rozwinięte uwagi trenera w wierszu listy
  tr: false,       // tryb treningu (link zawodnika): plan, odhaczanie, przerwy
  trCtx: "", trGrupa: "", cel: null, trOtw: {}, przewin: false,
  timer: null, tTimer: null, audio: null,
  histOtw: {},     // klucz karty → rozwinięta historia tygodni
  arkusz: null, arkuszSyg: "",   // okienko „Ostatnie treningi” (link zawodnika)
  offline: false,  // Streamlit zgłasza zerwane połączenie (disabled)
  pewnyKoniec: false, legenda: false,
  zalatwione: new Set(),   // id potwierdzone albo odrzucone — nie wracają z localStorage
};
const root = document.getElementById("root");

/* ---------------------------------------------------------------- pomocnicze */
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const txt = (v) => String(v == null ? "" : v).trim();
const ctxKlucz = (c) => (c ? `${c.plan_id}|${c.sess_id}|${c.wk}` : "");
const kl = (karta) => ctxKlucz(S.ctx) + "|" + karta.i;
const miejsceOp = (op) => op.typ === "usun" || op.typ === "dodaj" || op.typ === "zamien"
  ? miejsceEd(op)
  : (op.typ === "koniec" ? "k|" : "c|") + ctxKlucz(op) + (op.typ === "koniec" ? "" : "|" + op.i);
const kartaOp = (op) => ctxKlucz(op) + "|" + op.i;
const oczekujace = () => Object.keys(S.kolejka).length;
const TYPY = new Set(["cwiczenie", "koniec", "usun", "dodaj", "zamien"]);
const EDYCJE = new Set(["usun", "dodaj", "zamien"]);
// zmiana rozpiski tego treningu czeka na zapis — do potwierdzenia lista jest
// zablokowana: klucz karty to indeks, a po zapisie indeksy się przesuwają,
// więc wpis zrobiony w międzyczasie trafiłby do innego ćwiczenia (przegląd 2026-09-28)
const edycjaCzeka = () => !!S.ctx && Object.values(S.kolejka).some(
  (op) => EDYCJE.has(op.typ) && ctxKlucz(op) === ctxKlucz(S.ctx));
// zmiana rozpiski: własne miejsce w kolejce (nie zastępuje wpisów serii)
const miejsceEd = (op) => "e|" + op.id;

// blok = sekcja + cyfra numeru („1a”, „1b” → 1); Prep bez litery to osobne bloki
function grupaK(karta) {
  const m = String(karta.slot || "").match(/^\d+/);
  return karta.section + "|" + (m ? m[0] : String(karta.slot || karta.i));
}
function grupy() {
  const out = [];
  for (const karta of S.karty) {
    const g = grupaK(karta), k = kl(karta);
    const ost = out[out.length - 1];
    if (ost && ost.key === g) ost.ks.push(k); else out.push({ key: g, ks: [k] });
  }
  return out;
}
function kopiaSerii(serie) {
  return (serie || []).map((s) => {
    const o = { kg: txt(s && s.kg), reps: txt(s && s.reps), rpe: txt(s && s.rpe), stan: (s && s.stan) || "" };
    if (s && s.auto && s.auto.length) o.auto = s.auto.slice();   // wstawione samym ✓
    return o;
  });
}
function zSerwera(karta) {
  return { serie: kopiaSerii(karta.serie), notatka: txt(karta.notatka), notZm: false };
}
function zOp(op, karta) {
  return { serie: kopiaSerii(op.serie),
    notatka: op.notatka == null ? txt(karta.notatka) : String(op.notatka),
    notZm: op.notatka != null };
}
// to samo co training.scal_serie: pole zmienione na telefonie (względem bazy)
// wygrywa, reszta z serwera — telefon od razu widzi wpisy drugiej strony
const POLA = ["kg", "reps", "rpe", "stan"];
function scal(baza, moje, obecne) {
  const n = Math.max((baza || []).length, (moje || []).length, (obecne || []).length), out = [];
  for (let i = 0; i < n; i++) {
    const b = (baza || [])[i] || {}, m = (moje || [])[i] || {}, c = (obecne || [])[i] || {}, s = {};
    for (const f of POLA) s[f] = txt(m[f]) === txt(b[f]) ? txt(c[f])
      : ((m.auto || []).includes(f) && txt(c[f])) ? txt(c[f]) : txt(m[f]);
    out.push(s);
  }
  while (out.length && !POLA.some((f) => out[out.length - 1][f])) out.pop();
  return out;
}
function dzisiaj() {
  const d = new Date(), z = (x) => String(x).padStart(2, "0");
  return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}`;
}
function seria(st, si) {
  while (st.serie.length <= si) st.serie.push({ kg: "", reps: "", rpe: "", stan: "" });
  return st.serie[si];
}
function przytnij(st) {
  const pusta = (s) => !(txt(s.kg) || txt(s.reps) || txt(s.rpe) || s.stan);
  while (st.serie.length && pusta(st.serie[st.serie.length - 1])) st.serie.pop();
}
// wierszy: tyle, ile rozpisał trener (albo ustawił + / −), nigdy mniej niż wpisanych
function ileWierszy(k) {
  const karta = S.meta[k], st = S.stan[k];
  const n0 = S.ile[k] != null ? S.ile[k] : Math.max(+karta.n_plan || 1, 1);
  return Math.max(n0, st.serie.length, 1);
}
const stanW = (st, si) => (st.serie[si] || {}).stan || "";
function ileOk(k) {
  const st = S.stan[k], n = ileWierszy(k);
  let o = 0;
  for (let si = 0; si < n; si++) if (stanW(st, si) === "ok") o++;
  return o;
}
// stan ćwiczenia na liście: zrobione (wszystkie ✓) / czesc / pominiete (same ✕) / ""
function stanKarty(k) {
  const st = S.stan[k], n = ileWierszy(k), o = ileOk(k);
  if (o === n) return "zrobione";
  if (o > 0) return "czesc";
  for (let si = 0; si < n; si++) if (stanW(st, si) === "skip") return "pominiete";
  return "";
}
// Filip 2026-10-01: ciężar i powtórzenia wpisane we wszystkich seriach =
// ćwiczenie zrobione — odhaczam je i zwijam kartę. Tylko gdy to wpisanie
// domknęło ćwiczenie: ręczne ✓/✕ zostawia kartę otwartą jak dotąd. Nie przy
// otwartej notatce ani formularzu zamiany.
function domknij(k) {
  const st = S.stan[k];
  if (S.tr || !st) return false;
  const n = ileWierszy(k);
  for (let si = 0; si < n; si++) {
    const s = st.serie[si] || {};
    if (s.stan === "skip" || !txt(s.kg) || !txt(s.reps)) return false;
  }
  let zmiana = false;
  for (let si = 0; si < n; si++) { const s = seria(st, si); if (!s.stan) { s.stan = "ok"; zmiana = true; } }
  if (zmiana && S.otwarte[k] && !S.notOtw[k] && !S.ed[k]) S.otwarte[k] = false;
  return zmiana;
}
// po wyjściu z pól (klawiatura schowana, stuknięcie gdzie indziej): sprawdzam
// ćwiczenia, w których coś wpisano. Przejście do kolejnego pola nic nie zwija.
function sprobujDomknac() {
  const akt = document.activeElement;
  if (document.hasFocus() && akt && akt.classList && akt.classList.contains("pole")) return;
  if (S.wcisniety) { S.domknijCzeka = true; return; }     // najpierw obsługa stuknięcia
  let zm = false;
  for (const k of S.doDomkniecia) if (domknij(k)) { kolejkuj(k); zm = true; }
  S.doDomkniecia.clear();
  if (zm) { render(); SEND(); }
}
function rozstrzygnieta(k) {
  const st = S.stan[k], n = ileWierszy(k);
  for (let si = 0; si < n; si++) if (!stanW(st, si)) return false;
  return true;
}
function poprzednia(st, si, f) {
  for (let j = si - 1; j >= 0; j--) {
    const s = st.serie[j];
    if (s && s.stan !== "skip" && txt(s[f])) return txt(s[f]);
  }
  return "";
}
// powtórzenia do jednego stuknięcia ✓: z rozpiski, gdy jednoznaczna („7",
// „6, 6, 6" — Python daje je w reps_plan), inaczej z poprzedniej serii;
// przy „8-12" bez poprzedniej — puste (dolna granica byłaby zmyślona)
function repsDoWstawienia(k, si) {
  const karta = S.meta[k];
  return txt((karta.reps_plan || [])[si]) || poprzednia(S.stan[k], si, "reps");
}
// jedno stuknięcie ✓: powt. jak wyżej, kg z poprzedniej serii tej karty
// (pierwszą trener wpisuje sam), RPE nigdy samo. Drugie ✓ cofa — liczby zostają.
function odhacz(k, si) {
  const s = seria(S.stan[k], si);
  if (s.stan === "ok") { s.stan = ""; return; }
  s.stan = "ok";
  // pola wstawione samym ✓ są oznaczone — przy scalaniu ustępują liczbom
  // wpisanym w międzyczasie przez drugą stronę (weryfikacja R1-02)
  const auto = [];
  if (!txt(s.reps)) { s.reps = repsDoWstawienia(k, si); if (s.reps) auto.push("reps"); }
  if (!txt(s.kg) && S.rola !== "zawodnik") { s.kg = poprzednia(S.stan[k], si, "kg"); if (s.kg) auto.push("kg"); }
  if (auto.length) s.auto = auto; else delete s.auto;
}
function pomin(k, si) {
  const s = seria(S.stan[k], si);
  s.stan = s.stan === "skip" ? "" : "skip";
}
// podpowiedź powtórzeń w polu: element listy dla tej serii („5+5, 5+5" → „5+5");
// długi opis („last week: @ 70, …", „25-30 sec ISO") zostaje tylko w dawce nad
// seriami — w polu 50–70 px byłby uciętym „last wee"
function hintReps(karta, si) {
  const r = txt(karta.reps_hint), czesci = r.split(",").map(txt);
  const h = czesci.length > 1 ? (czesci[si] || "") : r;
  return h.length <= 7 ? h : "";
}
// szare podpowiedzi = to, co wstawi ✓; kg pierwszej serii i zakres powtórzeń
// to tylko przypomnienie. W serii odhaczonej pusto znaczy pusto.
function podpowiedzi(k, si) {
  const karta = S.meta[k], st = S.stan[k], s = st.serie[si] || {};
  if (s.stan) return { kg: "", reps: "", rpe: "" };
  // RPE z rozpiski jako podpowiedź (Filip 2026-09-30) — ✓ go nie wpisuje;
  // u zawodnika bez podpowiedzi ciężaru: „ciężar musi wpisać dana osoba”
  if (S.rola === "zawodnik") return { kg: "", reps: repsDoWstawienia(k, si) || hintReps(karta, si), rpe: txt((karta.rpe_plan || [])[si]) };
  return { kg: si === 0 ? txt(karta.kg_hint) : poprzednia(st, si, "kg"),
    reps: repsDoWstawienia(k, si) || hintReps(karta, si), rpe: txt((karta.rpe_plan || [])[si]) };
}
// „1 × 5 @ RPE 8 + 2 × 7 @ RPE 8” — RPE jako żółta plakietka
function htmlDawka(karta) {
  const t = txt(karta.dawka_pelna) || [txt(karta.dawka), txt(karta.intent)].filter((x) => x && x !== "—").join(" · ");
  return esc(t).replace(/@ RPE ([\d,.\-\/]+)/g, '<span class="pvintent">@ RPE $1</span>');
}
function wpisy(n) {
  const d = n % 10, s = n % 100;
  if (n === 1) return "1 wpis czeka na zapis";
  if (d >= 2 && d <= 4 && !(s >= 12 && s <= 14)) return `${n} wpisy czekają na zapis`;
  return `${n} wpisów czeka na zapis`;
}

/* ---------------------------------------------------------------- kolejka i wysyłka */
function zapiszLS() {
  try {
    // wpisy innej karty z tym samym kluczem zostają — nadpisanie całej listy
    // gubiło kolejkę zamkniętej karty (audyt KOL-3)
    const moje = Object.values(S.kolejka), ids = new Set(moje.map((op) => String(op.id)));
    let obce = [];
    try { obce = JSON.parse(localStorage.getItem(LS) || "[]"); } catch (e) { obce = []; }
    if (!Array.isArray(obce)) obce = [];
    // obca karta z tym samym ćwiczeniem: jej wpis zostaje obok mojego —
    // serwer scala oba względem ich baz (OFF-V1-05)
    obce = obce.filter((op) => op && op.id && !ids.has(String(op.id))
      && !S.zalatwione.has(String(op.id)));
    const ops = moje.concat(obce);
    if (ops.length) localStorage.setItem(LS, JSON.stringify(ops));
    else localStorage.removeItem(LS);
  } catch (e) { /* prywatne okno / blokada — kolejka zostaje w pamięci */ }
}
function wczytajLS() {
  try {
    const ops = JSON.parse(localStorage.getItem(LS) || "[]");
    if (!Array.isArray(ops)) return;
    for (const op of ops) doKolejki(op);
  } catch (e) { /* uszkodzony wpis — pomijam */ }
}
function doKolejki(op) {
  if (!(op && op.id && TYPY.has(op.typ) && !S.zalatwione.has(String(op.id))
      && Date.now() - (+op.t || 0) < TTL)) return;
  const m = miejsceOp(op);
  if (!S.kolejka[m]) S.kolejka[m] = op;
  else if (String(S.kolejka[m].id) !== String(op.id)) S.kolejka[m + "#" + op.id] = op;
}
// klucz kolejki zawodnika = osoba|folder: po zmianie folderu albo nazwy przez
// trenera wpisy bez zasięgu leżały pod starym kluczem i nikt ich nie wysyłał
// (audyt SRV-03) — przy starcie przejmuję wpisy tego planu spod innych kluczy
function przygarnij(planId) {
  let jest = false;
  if (!planId) return jest;
  try {
    for (let i = localStorage.length - 1; i >= 0; i--) {
      const klucz = localStorage.key(i);
      if (!klucz || klucz === LS || !klucz.startsWith("aph.zaw.outbox.")) continue;
      const ops = JSON.parse(localStorage.getItem(klucz) || "[]");
      if (!Array.isArray(ops)) continue;
      const moje = ops.filter((op) => op && op.plan_id === planId), reszta = ops.filter((op) => !(op && op.plan_id === planId));
      if (!moje.length) continue;
      if (reszta.length) localStorage.setItem(klucz, JSON.stringify(reszta)); else localStorage.removeItem(klucz);
      moje.forEach(doKolejki);
      jest = true;
    }
  } catch (e) {}
  return jest;
}
function kolejkuj(k) {
  const karta = S.meta[k], st = S.stan[k], c = S.metaCtx[k];
  if (!karta || !st || !c) return;
  const op = { id: nowyId(), typ: "cwiczenie", t: Date.now(),
    plan_id: c.plan_id, sess_id: c.sess_id, wk: c.wk,
    i: karta.i, exercise: karta.exercise || "",
    // miejsce w planie: po zmianie nazwy / zamianie przez trenera wpis trafia
    // tam, gdzie był (sekcja + numer), zamiast przepaść (V4-02)
    section: karta.section || "", n: S.karty.length,
