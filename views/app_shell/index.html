<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   Athletic Performance Hub — app shell (Streamlit custom component)
   Tokeny i geometria = zatwierdzony design. NIE edytować bez zgody.
   ========================================================================== */
:root{
  --ink:#1c1b18; --dim:#6f6b61; --mute:#8a867c; --mute2:#a09c92; --faint:#b8b4aa;
  --page:#fbfbf9; --card:#fff; --tint:#f8f7f4; --hover:#fbfaf7; --fill:#f2f1ec;
  --line:#d8d5cc; --line2:#e6e3db; --hair:#eeece6; --hair2:#f2f1ec;
  --link:#3d63c9; --link-h:#274aa8;
  --green:oklch(0.58 0.13 155); --amber:oklch(0.58 0.13 60); --blue:oklch(0.58 0.13 255);
  --red-fg:#a8452f; --red-bg:#fdf1ee; --red-line:#f0d5cd;
  --amber-fg:#8a6420; --amber-bg:#fdf6e8;
  --row-pad:11px 16px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--page)}
body{font-family:'Archivo',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
a{color:var(--link);text-decoration:none} a:hover{color:var(--link-h);text-decoration:underline}
input,button,select,textarea{font-family:'Archivo',system-ui,sans-serif}
input:focus,select:focus{outline:none} ::placeholder{color:#c3c0b8}
select{appearance:none;background-image:none}

.app{display:flex;min-height:720px}

/* ---- sidebar ---- */
.side{width:224px;flex-shrink:0;background:var(--card);position:relative;z-index:2;
  box-shadow:1px 0 0 var(--hair), 4px 0 16px rgba(28,27,24,.05);
  display:flex;flex-direction:column;padding:26px 14px 18px}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px 16px;margin-bottom:18px;
  border-bottom:1px solid var(--hair)}
.brand i{width:26px;height:26px;border-radius:7px;background:var(--ink);flex-shrink:0}
.brand span{font-size:13.5px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
.side h3{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);padding:0 6px 7px;margin:0}
.side h3+h3,.navgroup+h3{padding-top:22px}
.navgroup{display:flex;flex-direction:column;gap:1px}
.navitem{display:flex;align-items:center;gap:9px;border:none;background:transparent;color:var(--dim);
  font-size:13.5px;font-weight:600;text-align:left;padding:8px 10px;border-radius:6px;cursor:pointer}
.navitem i{width:3px;height:15px;border-radius:2px;background:transparent;flex-shrink:0}
.navitem:hover{background:#f4f3ef}
.navitem.on{background:var(--fill);color:var(--ink);font-weight:700}
.navitem.on i{background:var(--ink)}
.side .spacer{flex:1}
.me{display:flex;align-items:center;gap:8px;padding:10px 10px 0;border-top:1px solid var(--hair2)}
.me i{width:24px;height:24px;border-radius:999px;background:#ecebe6;font-size:10.5px;font-weight:700;
  color:var(--dim);display:inline-flex;align-items:center;justify-content:center}
.me span{font-size:12.5px;font-weight:600;color:var(--dim)}

/* ---- page ---- */
.main{flex:1;min-width:0;position:relative}
.page{max-width:1180px;padding:34px 40px 70px}
h1{font-size:30px;font-weight:800;letter-spacing:-.015em;margin:0}
.sub{font-size:14px;color:var(--dim);margin-top:5px}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
.eyebrow{font-size:12.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink)}
.back{border:none;background:transparent;color:var(--mute);font-size:12.5px;font-weight:600;padding:0;cursor:pointer}
.back:hover{color:var(--ink)}

/* ---- buttons ---- */
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:13px;font-weight:600;
  padding:8px 15px;border-radius:6px;cursor:pointer;text-decoration:none;display:inline-flex;
  align-items:center;justify-content:center;gap:7px}
.btn:hover{background:var(--fill);text-decoration:none}
.btn.primary{border:none;background:var(--ink);color:#fff;padding:9px 18px}
.btn.primary:hover{background:#333029}
.btn.ghost{color:var(--dim)} .btn.ghost:hover{color:var(--ink)}
.btn.dash{border:1px dashed #c9c5bb;background:transparent;color:var(--mute)}
.btn.dash:hover{background:#f4f3ef;color:var(--ink);border-color:var(--mute2)}
.btn.sm{font-size:12.5px;padding:7px 14px}
.btn.xs{font-size:12px;padding:5px 12px}
.iconbtn{border:none;background:transparent;color:#c9c5bb;font-size:14px;cursor:pointer;padding:4px;line-height:1}
.iconbtn:hover{color:var(--ink)}
.iconbtn.del:hover{color:#c0392b}

/* ---- inputs ---- */
.in{border:1px solid var(--line2);border-radius:6px;padding:9px 11px;font-size:13.5px;background:#fdfdfb;color:var(--ink)}
.in:focus{border-color:var(--mute2);background:#fff}
.in.sm{padding:8px 11px}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute2)}

/* ---- tabs ---- */
.tabs{display:flex;align-items:center;border-bottom:1px solid var(--line2);margin-top:22px}
.tab{display:inline-flex;align-items:center;gap:7px;border:none;background:transparent;color:var(--mute);
  font-size:13.5px;font-weight:600;padding:10px 2px;margin-right:22px;border-bottom:2px solid transparent;
  cursor:pointer;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--ink)}
.tab .cnt{font-size:10.5px;font-weight:700;border-radius:4px;padding:2px 6px;font-variant-numeric:tabular-nums;
  color:var(--dim);background:var(--fill)}
.tab .cnt.red{color:var(--red-fg);background:var(--red-bg)}
.tab .cnt.amber{color:var(--amber-fg);background:var(--amber-bg)}

/* ---- cards, tables ---- */
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.thead,.trow{display:grid;gap:12px;align-items:center}
.thead{padding:9px 16px;border-bottom:1px solid var(--hair);background:var(--tint)}
.thead span{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute2)}
.trow{border-bottom:1px solid var(--hair2);padding:var(--row-pad);width:100%;text-align:left;
  border-left:none;border-right:none;border-top:none;background:transparent;cursor:pointer;font:inherit;color:inherit}
.trow:hover{background:var(--hover)}
.trow.static{cursor:default}
.num{font-variant-numeric:tabular-nums}
.badge{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  border-radius:4px;padding:3px 7px;justify-self:start}
.chev{font-size:13px;color:#c9c5bb;text-align:right}

/* ---- start ---- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:26px}
.stat{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;background:var(--card);
  border:1px solid var(--line);border-radius:10px;padding:15px 17px 17px;cursor:pointer}
.stat:hover{background:#fdfdfb;border-color:#c9c5bb}
.stat .lab{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--mute2)}
.stat .val{font-size:27px;font-weight:800;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.stat .unit{font-size:12.5px;color:var(--mute)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:20px;margin-top:24px;align-items:start}
.cols>div{min-width:0}
.addrow{display:flex;flex-wrap:wrap;gap:8px;padding:12px;border-bottom:1px solid var(--hair2)}
.addrow input{min-width:0}
.qrow{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--hair2)}
.qrow:hover{background:var(--hover)}
.qrow .d{font-size:12px;font-weight:600;color:var(--mute);width:46px;flex-shrink:0;font-variant-numeric:tabular-nums}
.qrow .n{font-size:13.5px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qrow .p{font-size:12.5px;color:var(--mute);white-space:nowrap}
.empty{padding:26px 14px;text-align:center;font-size:13px;color:var(--mute2)}
.rrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:none;
  border-bottom:1px solid var(--hair2);background:transparent;padding:11px 14px;cursor:pointer}
.rrow:hover{background:var(--hover)}
.rrow i{width:24px;height:24px;border-radius:6px;background:var(--fill);color:var(--dim);font-size:11px;
  font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;font-style:normal}
.rrow .t{display:flex;flex-direction:column;gap:1px;flex:1;min-width:0}
.rrow .t b{font-size:13.5px;font-weight:600}
.rrow .t s{font-size:11.5px;color:var(--mute);text-decoration:none}

/* ---- plan detail ---- */
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:12px}
.wcard{display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;background:var(--card);
  border:1px solid var(--line);border-radius:10px;padding:15px 16px 16px;cursor:pointer;text-decoration:none;color:var(--ink)}
.wcard:hover{background:#fdfdfb;border-color:#c9c5bb;text-decoration:none}
.wcard .h{display:flex;align-items:center;gap:9px}
.wcard .h i{width:24px;height:24px;border-radius:6px;background:var(--ink);color:#fff;font-size:11.5px;
  font-weight:700;display:inline-flex;align-items:center;justify-content:center;font-style:normal}
.wcard .h b{font-size:15px;font-weight:700}
.wcard .m{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:12.5px;color:var(--mute)}
.warn{font-size:11px;font-weight:600;color:var(--red-fg);background:var(--red-bg);
  border:1px solid var(--red-line);border-radius:4px;padding:2px 7px}
.addcard{min-height:88px}
.sharebar{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
  border-radius:8px;padding:11px 14px;margin-top:16px;max-width:640px}
.sharebar span{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--mute2);flex-shrink:0}
.sharebar input{flex:1;min-width:0;font-size:12.5px;color:var(--dim);padding:7px 10px}

/* ---- exercises ---- */
.segrows{display:flex;flex-direction:column;align-items:stretch;gap:6px;margin-top:10px}
.segs{display:flex;align-items:center;flex-wrap:wrap;gap:2px;background:var(--fill);
  border-radius:6px;padding:2px}
.seg{border:none;background:transparent;color:var(--dim);font-size:12px;font-weight:600;
  padding:6px 9px;border-radius:5px;cursor:pointer;white-space:nowrap}
.seg.on{background:#fff;color:var(--ink)}
.thumb{width:44px;height:28px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;background:#ecebe6;color:var(--mute)}
.thumb.no{background:var(--red-bg);color:#c0603f}
.notice{display:flex;align-items:center;gap:9px;border-radius:8px;padding:11px 14px;margin-top:18px;font-size:13px}
.notice i{width:3px;height:26px;border-radius:2px;flex-shrink:0}
.notice.red{background:#fdf7f6;border:1px solid var(--red-line);color:#7d4433}
.notice.red i{background:#c0603f}
.notice.amber{background:#fdfaf2;border:1px solid #ecdfc4;color:#7a5a1e}
.notice.amber i{background:#c08b2f}
.filminput{border:1px dashed #d9b8b3;background:#fdf7f6;border-radius:6px;padding:8px 11px;font-size:13px}
.filminput:focus{border-style:solid;border-color:var(--mute2);background:#fff}

/* ---- modal ---- */
.scrim{position:absolute;inset:0;background:rgba(28,27,24,.32);z-index:60}
.scrim .modal{position:absolute;left:50%;top:var(--mtop,50%);transform:translate(-50%,-50%);
  max-height:calc(100% - 32px);overflow:auto}
.modal{width:480px;background:#fff;border:1px solid var(--line);border-radius:8px;
  box-shadow:0 24px 60px -24px rgba(28,27,24,.4)}
.modal .mh{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 20px;
  border-bottom:1px solid var(--hair2)}
.modal .mh b{font-size:16px;font-weight:700}
.modal .mb{padding:20px;display:flex;flex-direction:column;gap:14px}
.modal .mf{display:flex;align-items:center;gap:9px;padding:14px 20px;border-top:1px solid var(--hair2);background:#fdfdfb}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* ---- rozszerzenia integracyjne (funkcje istniejacej aplikacji) ---- */
.menuwrap{position:relative}
.menu{position:absolute;right:0;top:40px;z-index:30;background:#fff;border:1px solid var(--line);
  border-radius:6px;box-shadow:0 8px 28px rgba(28,27,24,.12);min-width:236px;padding:6px;
  display:flex;flex-direction:column;gap:1px}
.mi{border:none;background:transparent;text-align:left;font-size:13px;font-weight:600;color:var(--ink);
  padding:8px 10px;border-radius:5px;cursor:pointer;font-family:inherit}
.mi:hover{background:var(--fill)} .mi.danger{color:#c0392b} .mi.danger:hover{background:#fdf3f2}
.msep{height:1px;background:var(--hair2);margin:4px 2px}
.ok{font-size:11px;font-weight:600;color:oklch(0.45 0.12 155);background:oklch(0.95 0.04 155);
  border:1px solid oklch(0.88 0.06 155);border-radius:4px;padding:2px 7px}
.pickbar{display:flex;align-items:center;gap:10px;background:var(--tint);border:1px solid var(--line);
  border-radius:8px;padding:10px 14px;margin-top:18px;font-size:13px}
.pickbar>span{flex:1;min-width:0}
.thumb img{width:44px;height:28px;object-fit:cover;border-radius:4px;display:block}
.trow.pick{cursor:pointer}
/* przełącznik panelu trenera — prawy górny róg (Filip 2026-09-02) */
.topbar{display:flex;justify-content:flex-end;padding:14px 40px 0;position:relative;z-index:20}
.coachbtn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;
  color:var(--ink);font-size:13px;font-weight:600;padding:5px 12px 5px 5px;border-radius:999px;cursor:pointer}
.coachbtn:hover{background:var(--fill)}
.coachbtn i{width:26px;height:26px;border-radius:999px;background:var(--ink);color:#fff;font-size:12px;
  font-weight:700;font-style:normal;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.coachbtn s{color:var(--mute2);text-decoration:none;font-size:11px}
.undobar{display:flex;align-items:center;gap:12px;margin:14px 40px 0;padding:10px 14px;
  background:var(--ink);color:#fff;border-radius:8px;font-size:13px;max-width:640px}
.undobar b{font-weight:700}
.undobar button{margin-left:auto;border:1px solid rgba(255,255,255,.45);background:transparent;
  color:#fff;border-radius:6px;padding:5px 12px;font-size:12.5px;font-weight:600;cursor:pointer}
.undobar button:hover{background:rgba(255,255,255,.14)}
.undobar button.x{margin-left:0;border:none;padding:4px 6px;font-size:13px;opacity:.75}
.coachmenu{position:absolute;right:40px;top:50px;z-index:30;background:#fff;border:1px solid var(--line);
  border-radius:8px;box-shadow:0 8px 28px rgba(28,27,24,.12);min-width:210px;padding:6px;
  display:flex;flex-direction:column;gap:1px}
.coachmenu button{display:flex;align-items:center;gap:9px;border:none;background:transparent;text-align:left;
  font-size:13px;font-weight:600;color:var(--ink);padding:8px 10px;border-radius:5px;cursor:pointer;font-family:inherit}
.coachmenu button:hover{background:var(--fill)}
.coachmenu button.on{background:var(--fill)}
.coachmenu i{width:24px;height:24px;border-radius:999px;background:var(--fill);color:var(--dim);font-size:11px;
  font-weight:700;font-style:normal;display:inline-flex;align-items:center;justify-content:center}
.coachmenu button.on i{background:var(--ink);color:#fff}
/* zwijany panel boczny (Filip 2026-09-02): po otwarciu apki zawsze
   rozwiniety, zwiniecie zyje tylko do przeladowania strony */
.main{position:relative}
.navtoggle{margin-left:auto;border:1px solid var(--line);background:#fff;color:var(--dim);width:24px;height:24px;
  border-radius:6px;cursor:pointer;font-size:14px;line-height:1;padding:0;flex-shrink:0}
.navtoggle:hover{background:var(--fill);color:var(--ink)}
.navopen{position:absolute;left:12px;top:14px;z-index:30;border:1px solid var(--line);background:#fff;color:var(--dim);
  width:28px;height:28px;border-radius:6px;cursor:pointer;font-size:15px;line-height:1;padding:0}
.navopen:hover{background:var(--fill);color:var(--ink)}
/* komórka-przycisk w wierszu listy (np. folder planu) */
.cellbtn{border-radius:5px;padding:2px 6px;margin:-2px -6px;cursor:pointer;
  text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cellbtn:hover{background:var(--fill);color:var(--ink)!important;
  box-shadow:inset 0 0 0 1px var(--line)}
/* po zwinieciu panelu tresc zostaje w miejscu (bez skoku do lewej krawedzi) */
.main.nocol .page{padding-left:264px}
@media (max-width:1100px){ .main.nocol .page{padding-left:56px} }
.ytprev{width:100%;aspect-ratio:16/9;border:0;border-radius:6px;background:#000;display:block}

/* ---- Podopieczni ---- */
.osoba{display:flex;align-items:center;gap:14px;width:100%;padding:13px 16px;
  background:none;border:0;border-bottom:1px solid #f0efea;cursor:pointer;text-align:left;font:inherit}
.osoba:last-child{border-bottom:0}
.osoba:hover{background:#faf9f6}
.ini{flex:none;width:38px;height:38px;border-radius:11px;background:#eceae3;color:#5c5949;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;letter-spacing:.02em}
.ini.big{width:52px;height:52px;border-radius:15px;font-size:17px}
.ktohead{display:flex;align-items:center;gap:14px}
.kto{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.kto b{font-size:14px;font-weight:650;color:#1c1b18}
.kto i{font-style:normal;font-size:12px;color:#8a8779}
.licz{display:flex;flex-direction:column;align-items:center;gap:1px;flex:none;min-width:52px}
.licz em{font-style:normal;font-size:15px;font-weight:700;color:#3c3a33}
.licz span{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#a5a294}
.licz.test em{color:#a8811f}
.osoba .strzalka{flex:none;color:#c3c0b3;font-size:19px;padding-left:2px}
.etyk{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;
  color:#8a8779;padding:14px 16px 8px}
.rmznak{display:inline-block;padding:2px 8px;border-radius:6px;background:#fdf3d4;
  color:#7a5b16;font-weight:700;font-size:11px;letter-spacing:.03em;box-shadow:inset 0 0 0 1px #e8c96a}
.pusto{padding:20px 16px;color:#8a8779;font-size:13px;line-height:1.5}

/* ---- profil zawodnika: sekcje z oddechem ---- */
.profhead{display:flex;align-items:center;gap:15px;margin:0 0 18px}
.profhead h1{margin:0}
.profhead .sub{margin-top:3px}
.segs.profzak{display:inline-flex;margin:0 0 22px}
.sekcja{margin:0 0 26px}
.sekcja:last-child{margin-bottom:0}
.sekcja h2{margin:0 0 11px;font-size:12px;font-weight:700;text-transform:uppercase;
  letter-spacing:.08em;color:#8a8779;display:flex;align-items:center;gap:8px}
.sekcja h2 .ilez{font-size:10.5px;font-weight:700;color:#a5a294;background:#f2f1eb;
  padding:2px 7px;border-radius:20px;letter-spacing:.02em}
.sekcja .podpis{margin:-4px 0 11px;font-size:12px;color:#a5a294;line-height:1.5;max-width:560px}

/* kafelek aktualnego planu — zielony znacznik w prawym górnym rogu */
.kafelplan{position:relative;display:flex;flex-direction:column;gap:5px;
  padding:17px 19px 18px;background:#fff;border:1px solid #eceae3;border-radius:13px;
  cursor:pointer;transition:border-color .12s,box-shadow .12s}
.kafelplan:hover{border-color:#dcd9cf;box-shadow:0 1px 3px rgba(28,27,24,.06)}
.kafelplan .aktywny{position:absolute;top:14px;right:14px}
.kafelplan b{font-size:16px;font-weight:650;color:#1c1b18;padding-right:78px;line-height:1.3}
.kafelplan .meta{font-size:12.5px;color:#8a8779}

/* plany wcześniejsze — lista z datami */
.planrow{display:flex;align-items:center;gap:14px;width:100%;padding:13px 17px;
  background:none;border:0;border-bottom:1px solid #f2f1eb;cursor:pointer;
  text-align:left;font:inherit}
.planrow:last-child{border-bottom:0}
.planrow:hover{background:#faf9f6}

</head>
<body>
<div id="root"></div>
<script>
/* ==========================================================================
   Protokół Streamlit — plain JS, bez Node i bez builda.
   ========================================================================== */
const IID = Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4); let SEQ = 0;
const SEND  = v => parent.postMessage({isStreamlitMessage:true,type:"streamlit:setComponentValue",
  value:Object.assign({},v,{seq:IID+"-"+(++SEQ)}),dataType:"json"},"*");
const READY = () => parent.postMessage({isStreamlitMessage:true,type:"streamlit:componentReady",apiVersion:1},"*");
const SETH  = h => parent.postMessage({isStreamlitMessage:true,type:"streamlit:setFrameHeight",height:h},"*");

const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* kolory kategorii i statusów — muszą zgadzać się z sekcjami panelu treningowego */
const CAT = {
  "Movement Prep" :["oklch(0.44 0.11 155)","oklch(0.95 0.035 155)"],
  "Plyometrics"   :["oklch(0.46 0.11 60)","oklch(0.95 0.035 60)"],
  "Jump"          :["oklch(0.47 0.12 40)","oklch(0.95 0.04 40)"],
  "Throws"        :["oklch(0.44 0.10 200)","oklch(0.95 0.03 200)"],
  "Run"           :["oklch(0.45 0.13 350)","oklch(0.95 0.04 350)"],
  "Sled variation":["oklch(0.44 0.09 145)","oklch(0.95 0.03 145)"],
  "Isometrics"    :["oklch(0.45 0.10 285)","oklch(0.95 0.03 285)"],
  "Wzorce ruchu"  :["oklch(0.44 0.11 255)","oklch(0.95 0.03 255)"],
  "Staw / mięsień":["oklch(0.44 0.10 310)","oklch(0.95 0.03 310)"],
  "Nieprzypisane" :["#a8452f","#fdf1ee"],
};
const STATUS = {
  "Trwa"     :["oklch(0.45 0.12 155)","oklch(0.95 0.04 155)"],
  "Szkic"    :["#8a6420","#fdf6e8"],
  "Zamknięty":["#6f6b61","#f2f1ec"],
};

/* ---------------------------------------------------------------- dane
   Puste do pierwszego „streamlit:render" — Python podaje wszystko przez args
   (patrz message listener na końcu pliku).                                   */
let D = {
  user:{name:"",initials:""}, stats:{plans:0,plans_active:0,athletes:0,no_film:0},
  queue:[], recent:[], athletes_list:[], plans:[], groups:[], plan:null,
  exercises:[], exercises_total:0, no_film:[], no_film_total:0, no_film_skipped:[],
  no_cat:[], no_cat_total:0, categories:[], roster:null, athlete:null, hidden:[],
};

/* ---------------------------------------------------------------- stan UI */
let S = {screen:"start", planTab:"plany", askBase:false, odlozone:false, exTab:"all", cat:"Wszystkie", grp:"Wszystkie",
         planQuery:"", exQuery:"", share:false, modal:false, menu:false, coachMenu:false,
         navCollapsed:false,   // start zawsze rozwinięty — bez pamiętania stanu
         // widok listy podopiecznych — wybór przeżywa zamknięcie karty
         rosterView:(()=>{ try{ return localStorage.getItem("aph.roster") || "kafelki"; }
                           catch(_){ return "kafelki"; } })(),
         rosterEdit:false, amodal:null,   // tryb porządków na liście podopiecznych
         q:{name:"",plan:"",date:""}};
const FORM = {};   // wartosci pol, wysylane razem z akcja (przezywaja przebudowe DOM)
const ytId = u => { const m = /(?:v=|youtu\.be\/|shorts\/|embed\/)([A-Za-z0-9_-]{11})/.exec(u||""); return m ? m[1] : ""; };

const act = (action, extra) => SEND(Object.assign(
  {action, screen:S.screen,
   // stan powłoki jedzie z każdą akcją — Python odsyła go z powrotem,
   // żeby po rerunie nie zgubić zakładki, filtra ani wpisanej frazy
   // (Baza, lista planów, zakładka profilu)
   exview:{tab:S.exTab, cat:S.cat, query:S.exQuery,
           grp:S.grp, planQuery:S.planQuery, profTab:S.profTab}},
  extra||{}));

/* ---------------------------------------------------------------- sidebar */
const NAV = [
  {group:"Workspace", items:[{id:"start", label:"Start"}]},
  {group:"Trening",   items:[{id:"plans", label:"Training Plans"},
                             {id:"exercises", label:"Baza ćwiczeń"},
                             {id:"testing", label:"Performance testing"}]},
  {group:"Zawodnicy", items:[{id:"athletes", label:"Podopieczni"}]},
];
function sidebar(){
  // instancja „tylko plany" (drugi trener) nie pokazuje Performance testing
  const NAV_WID = D.tylko_plany
    ? NAV.map(g=>({...g, items:g.items.filter(it=>it.id!=="testing")}))
    : NAV;
  const groups = NAV_WID.map(g=>`<h3>${esc(g.group)}</h3><div class="navgroup">` + g.items.map(it=>{
    const on = S.screen===it.id || (it.id==="plans" && S.screen==="plan");
    return `<button class="navitem${on?" on":""}" data-act="nav" data-v="${it.id}"><i></i>${esc(it.label)}</button>`;
  }).join("") + `</div>`).join("");
  if(S.navCollapsed) return "";
  return `<div class="side">
    <div class="brand"><i></i><span>Athletic<br>Performance Hub</span>
      <button class="navtoggle" data-act="navtoggle" title="Zwiń panel">‹</button></div>
    ${groups}
    <div class="spacer"></div>
    <div class="me"><i>${esc(D.user.initials)}</i><span>${esc(D.user.name)}</span></div>
  </div>`;
}

/* ------------------------------------------------- przełącznik panelu */
function coachbar(){
  const list = D.coaches || [];
  if(!list.length) return "";
  const cur = list.find(c=>c.id===D.coach) || list[0];
  const menu = S.coachMenu ? `<div class="coachmenu">` + list.map(c=>
      `<button class="${c.id===cur.id?"on":""}" data-act="switch_coach" data-id="${esc(c.id)}">
         <i>${esc(c.initials)}</i>${esc(c.name)}</button>`).join("") + `</div>` : "";
  return `<div class="topbar">
    <button class="coachbtn" data-act="coachmenu" title="Zmień panel trenera">
      <i>${esc(cur.initials)}</i>${esc(cur.name)} <s>▾</s></button>${menu}</div>`;
}

/* ---------------------------------------------------------------- Start */
/* Polska odmiana: 1 ćwiczenie, 2-4 ćwiczenia, 5+ (i 12-14) ćwiczeń. */
function odm(n, poj, kilka, wiele){
  n = Math.abs(Number(n) || 0);
  const d = n % 10, s = n % 100;
  if (n === 1) return poj;
  if (d >= 2 && d <= 4 && !(s >= 12 && s <= 14)) return kilka;
  return wiele;
}

function screenStart(){
  const st = D.stats;
  const stats = [
    ["Plany", st.plans, "aktywnych "+st.plans_active, "plans", null],
    ["Zawodnicy", st.athletes, odm(st.athletes, "profil", "profile", "profili"),
     "athletes", null],
    ["Bez filmu", st.no_film,
     odm(st.no_film, "ćwiczenie", "ćwiczenia", "ćwiczeń"), "exercises", "film"],
  ].map(([lab,val,unit,scr,tab])=>
    `<button class="stat" data-act="nav" data-v="${scr}" data-tab="${tab||""}">
       <span class="lab">${esc(lab)}</span>
       <span style="display:flex;align-items:baseline;gap:7px">
         <span class="val">${esc(val)}</span><span class="unit">${esc(unit)}</span></span>
     </button>`).join("");

  const queue = D.queue.length
    ? D.queue.map((q,i)=>`<div class="qrow">
        <span class="d">${esc(q.date)}</span><span class="n">${esc(q.name)}</span>
        <span class="p">${esc(q.plan)}</span>
        <button class="btn xs" data-act="queue_open" data-i="${i}">Rozpisz</button>
        <button class="iconbtn del" data-act="queue_del" data-i="${i}" title="Zrobione — zdejmij z listy">×</button></div>`).join("")
    : `<div class="empty">Nic nie czeka.</div>`;

  const recent = D.recent.map(r=>`<button class="rrow" data-act="open_plan" data-id="${esc(r.id)}">
      <i>${esc(r.initials)}</i><span class="t"><b>${esc(r.plan)}</b><s>${esc(r.meta)}</s></span>
      <span class="chev">→</span></button>`).join("");

  return `<div class="page">
    <div class="pagehead">
      <div><h1>Start</h1><div class="sub">Kolejka do rozpisania i szybki dostęp do planów.</div></div>
      <button class="btn primary" data-act="new_plan_start">Rozpisz plan</button>
    </div>
    <div class="stats">${stats}</div>
    <div class="cols">
      <div>
        <div class="eyebrow" style="margin-bottom:8px">Do rozpisania</div>
        <div class="card">
          <div class="addrow">
            <input class="in sm" style="flex:1 1 150px" data-f="q.name" value="${esc(S.q.name)}" placeholder="imię i nazwisko">
            <input class="in sm" style="flex:1 1 130px" data-f="q.plan" value="${esc(S.q.plan)}" placeholder="nazwa planu">
            <input class="in sm" style="flex:0 0 118px;font-size:13px" type="date" data-f="q.date" value="${esc(S.q.date)}">
            <button class="btn primary" style="flex:0 0 auto" data-act="queue_add">Dodaj</button>
          </div>
          ${queue}
        </div>
      </div>
      <div>
        <div class="eyebrow" style="margin-bottom:8px">Ostatnio edytowane</div>
        <div class="card">${recent || `<div class="empty">Nic jeszcze nie edytowałeś.</div>`}</div>
      </div>
    </div>
  </div>`;
}

/* ---------------------------------------------------------------- Training Plans */
function screenPlans(){
  const q = S.planQuery.trim().toLowerCase();
  const grps = D.groups || [];
  // „Wszystkie" pokazuje tylko plany zatwierdzone do bazy (Filip 2026-09-05:
  // „zacznijmy od zera, bo się zrobił burdel"). Reszta zostaje w swoim
  // folderze — klub ma tam wisieć bez zaśmiecania listy. Szukanie po nazwie
  // sięga wszędzie, inaczej plan spoza bazy byłby nie do znalezienia.
  const rows = D.plans.filter(p=>{
    if(q && !(p.name.toLowerCase().includes(q)||p.athlete.toLowerCase().includes(q))) return false;
    if(S.grp==="Bez folderu") return !p.group;
    if(S.grp!=="Wszystkie")   return p.group===S.grp;
    return q ? true : p.in_base === true;
  });
  const GRID = "grid-template-columns:96px 1fr 170px 150px 96px 30px 26px";
  const wybrany = grps.includes(S.grp);
  const segs = `<div class="segs">` +
    ["Wszystkie"].concat(grps, grps.length?["Bez folderu"]:[]).map(g=>
      `<button class="seg${S.grp===g?" on":""}" data-act="grp" data-v="${esc(g)}">${esc(g)}</button>`).join("")
    + `<button class="seg" data-act="add_group" title="Nowy folder">＋</button>`
    + (wybrany ? `<button class="seg" data-act="rename_group" title="Zmień nazwę folderu">✎</button>`
               + `<button class="seg" data-act="del_group" title="Usuń folder">✕</button>` : "")
    + `</div>`;
  const list = `
    <div style="display:flex;align-items:center;gap:10px;margin-top:18px;flex-wrap:wrap">
      <input class="in" style="flex:1;min-width:220px;max-width:340px;background:#fff" data-f="planQuery"
             value="${esc(S.planQuery)}" placeholder="Szukaj planu albo zawodnika…">
      ${segs}
      <span style="font-size:12.5px;color:var(--mute)">${rows.length} z ${D.plans.length}</span>
    </div>
    <div class="card" style="margin-top:12px">
      <div class="thead" style="${GRID}"><span>Data</span><span>Plan</span><span>Zawodnik</span><span>Folder</span><span>Status</span><span></span><span></span></div>
      ${rows.map(p=>{
        const [fg,bg]=STATUS[p.status]||STATUS["Szkic"];
        return `<button class="trow" style="${GRID}" data-act="open_plan" data-id="${esc(p.id)}">
          <span class="num" style="font-size:12.5px;color:var(--mute)">${esc(p.date)}</span>
          <span style="font-size:13.5px;font-weight:600">${esc(p.name)}</span>
          <span style="font-size:13px;color:var(--dim)">${esc(p.athlete)}</span>
          <span class="cellbtn" data-act="row_group" data-id="${esc(p.id)}" title="Zmień folder"
                style="font-size:12px;color:${p.group?"var(--dim)":"#c3c0b8"}">${esc(p.group||"—")}</span>
          <span class="badge" style="color:${fg};background:${bg}">${esc(p.status)}</span>
          <span class="cellbtn" data-act="edit_plan_row" data-id="${esc(p.id)}" title="Edytuj plan"
                style="text-align:center;color:var(--mute2)">✎</span>
          <span class="chev">→</span></button>`;
      }).join("")}
      ${rows.length ? "" : `<div style="padding:22px 18px;font-size:13px;color:var(--mute)">${
        q ? "Nic nie pasuje do wyszukiwania."
          : S.grp!=="Wszystkie" ? "Ten folder jest pusty."
          : D.plans.length ? (
              // bez folderów rada „wybierz folder" jest ślepa — plan da się
              // wtedy otworzyć tylko z wyszukiwarki albo z profilu (2026-09-20)
              (D.groups||[]).length
                ? esc(D.plans.length)+" planów czeka w folderach — wybierz folder obok albo wyszukaj po nazwie. Do tej listy trafiają plany, które zatwierdzisz na koniec rozpisywania."
                : esc(D.plans.length)+" planów jest poza bazą — wpisz nazwę albo zawodnika w wyszukiwarce, żeby je otworzyć. Do tej listy trafiają plany, które zatwierdzisz na koniec rozpisywania.")
          : "Brak planów. Zacznij od „＋ Nowy plan”."}</div>`}
    </div>`;

  const wyb = FORM["np.athlete"]||"";
  const opts = D.athletes_list.map(a=>`<option${wyb===a?" selected":""}>${esc(a)}</option>`).join("");
  const form = `
    <div class="card" style="padding:20px;margin-top:18px;max-width:720px">
      <div style="font-size:15px;font-weight:700;margin-bottom:16px">Nowy plan</div>
      <div class="grid2" style="gap:14px">
        <label class="field"><span>Zawodnik</span>
          <select class="in" data-f="np.athlete"><option>wybierz z listy…</option>${opts}</select></label>
        <label class="field"><span>albo nowa osoba</span>
          <input class="in" data-f="np.new_athlete" placeholder="imię i nazwisko"></label>
        <label class="field"><span>Nazwa planu</span>
          <input class="in" data-f="np.name" placeholder="np. GPP 1"></label>
        <label class="field"><span>Folder (opcjonalnie)</span>
          <input class="in" data-f="np.group" list="grouplist" placeholder="np. nazwa klubu">
          <datalist id="grouplist">${(D.groups||[]).map(g=>`<option value="${esc(g)}">`).join("")}</datalist></label>
        <div class="grid2" style="gap:14px">
          <label class="field"><span>Start</span>
            <input class="in" style="font-size:13px" type="date" data-f="np.start"></label>
          <label class="field"><span>Tygodnie</span>
            <input class="in num" data-f="np.weeks" value="4"></label>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:9px;margin-top:20px;padding-top:16px;border-top:1px solid var(--hair2)">
        <button class="btn primary" data-act="create_plan">Utwórz plan</button>
        <button class="btn ghost" data-act="plantab" data-v="plany">Anuluj</button>
      </div>
    </div>`;

  return `<div class="page">
    <div class="pagehead">
      <div><h1>Training Plans</h1><div class="sub">Rozpiski, PDF i link dla zawodnika.</div></div>
      <div style="display:flex;gap:9px">
        <button class="btn ghost" data-act="dyktando">🎙 Z dyktanda</button>
        <button class="btn primary" data-act="plantab" data-v="nowy">＋ Nowy plan</button>
      </div>
    </div>
    ${S.planTab==="nowy"?form:list}
  </div>`;
}

/* ---------------------------------------------------------------- Plan zawodnika */

    <button class="wcard" data-act="open_workout" data-letter="${esc(w.letter)}" data-sid="${esc(w.sid||"")}">
      <span class="h"><i>${esc(w.letter)}</i><b>${esc(w.name)}</b></span>
      <span class="m">${esc(w.count)} ${odm(w.count, "ćwiczenie", "ćwiczenia", "ćwiczeń")}
        ${w.no_film?`<span class="warn">${esc(w.no_film)} bez filmu</span>`:""}
        ${w.done?`<span class="ok">✓ ${esc(w.done)}</span>`:""}</span>

      <button class="mi" data-act="edit_plan">Edytuj plan</button>

          <span class="badge" style="color:${fg};background:${bg};padding:4px 8px">${esc(p.status)}</span>
          <button class="badge" data-act="toggle_in_base" title="Kliknij, żeby zmienić"
            style="padding:4px 8px;cursor:pointer;border:1px solid var(--hair2);${p.in_base===true
              ? "color:#4a7c3f;background:#eaf3e4" : "color:var(--mute);background:#fff"}"
            >${p.in_base===true?"✓ w bazie planów":"tylko w folderze"}</button>
        </div>
        <div class="sub" style="font-size:13.5px">${esc(p.athlete)} · ${esc(p.range)} · ${esc(p.weeks)} tygodnie</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <button class="btn" data-act="pdf">PDF</button>
        <button class="btn" data-act="share" style="background:${S.share?"var(--fill)":"#fff"}">Udostępnij</button>
        <span class="menuwrap"><button class="btn ghost" style="font-weight:700;padding:8px 12px${S.menu?";background:var(--fill)":""}" data-act="menu">···</button>${menu}</span>
      </div>

    ${share}

/* ---------------------------------------------------------------- Baza ćwiczeń */
function screenExercises(){
  // liczba wierszy na liscie — ustawiana w galezi „Wszystkie", w pozostalych
  // zakladkach zostaje null i naglowek pokazuje rozmiar calej Bazy
  let widoczne = null;
  const tabs = [["Wszystkie","all",null,""],
                ["Bez filmu","film",D.no_film_total,"red"],
                ["Bez kategorii","cat",D.no_cat_total,"amber"]].map(([l,k,c,tone])=>
    `<button class="tab${S.exTab===k?" on":""}" data-act="extab" data-v="${k}">${esc(l)}
      ${c!=null?`<span class="cnt ${tone}">${esc(c)}</span>`:""}</button>`).join("");

  let body = "";
  if (S.exTab==="all") {
    const q = S.exQuery.trim().toLowerCase();
    const grp = e => e.group || "Nieprzypisane";
    // filtr po konkretnej kategorii (Filip 2026-09-02: „kategorie zamiast
    // wzorce ruchu i staw mięsień"); kolor badge'a nadal wg grupy
    const w = e => S.cat==="Wszystkie" || e.cat===S.cat
                   || e.cat2===S.cat || e.cat3===S.cat || e.cat4===S.cat;
    const rows = D.exercises.filter(e=>w(e)&&(!q||e.name.toLowerCase().includes(q)));
    // przy filtrze konkretnej kategorii najpierw te, dla ktorych jest ona
    // GLOWNA, a dopiero potem doklejone przez druga kategorie
    // (Filip 2026-09-03: „najwazniejsza jest ta pierwsza kategoria")
    if (S.cat !== "Wszystkie") {
      const waga = e => e.cat === S.cat ? 0 : (e.cat2 === S.cat ? 1 : 2);
      rows.sort((a, b) => waga(a) - waga(b) || a.name.localeCompare(b.name, "pl"));
    }
    widoczne = rows.length;
    const pick = D.pick ? `<div class="pickbar">
        <span>Wybierz ćwiczenie do: <b>${esc(D.pick.plan_name)}</b> · ${esc(D.pick.session_title)} — klik w wiersz dodaje je i wraca do rozpiski.</span>
        <select class="in sm" data-f="pick.section">${["Prep","Plyo & Power","Main"].map(sx=>`<option${(FORM["pick.section"]||D.pick.section)===sx?" selected":""}>${esc(sx)}</option>`).join("")}</select>
        <button class="btn primary sm" style="flex:0 0 auto" data-act="pick_back">← Wróć bez wybierania</button></div>` : "";
    const uzyte = new Set();
    D.exercises.forEach(e=>{ uzyte.add(e.cat);
      if(e.cat2) uzyte.add(e.cat2); if(e.cat3) uzyte.add(e.cat3);
      if(e.cat4) uzyte.add(e.cat4); });
    // trzy poziomy filtra wg Filipa (2026-09-02): ogólne → wzorce → staw
    const RZEDY = [
      ["Wszystkie","Movement Prep","Plyometrics","Jump","Throws","Run",
       "Hip lock","Deep tier","Sled variation","Isometrics"],
      ["Squat bilateral","Squat unilateral","Hinge bilateral","Hinge unilateral",
       "Vertical press","Horizontal press","Vertical pull","Horizontal pull"],
      ["Hip","Ankle","Knee","Quad","Hamstring","Shoulder","Core","Spine","Neck","Biceps","Triceps","Wrist","Nieprzypisane"],
    ];
    const wRzedach = new Set(RZEDY.flat());
    // kategoria dodana później i nieujęta w układzie ląduje w 3. rzędzie
    RZEDY[2] = RZEDY[2].concat((D.categories||[]).map(c=>c.name).filter(n=>!wRzedach.has(n)));
    const btn = c => `<button class="seg${S.cat===c?" on":""}" data-act="cat" data-v="${esc(c)}">${esc(c)}</button>`;
    const segs = RZEDY
      .map(r => r.filter(c => c==="Wszystkie" || uzyte.has(c)))
      .filter(r => r.length)
      .map(r => `<div class="segs">${r.map(btn).join("")}</div>`).join("");
    const GRID = "grid-template-columns:44px minmax(190px,.5fr) 1fr 34px";
    body = pick + `
      <div style="margin-top:18px">
        <input class="in" style="width:100%;max-width:380px;background:#fff" data-f="exQuery"
               value="${esc(S.exQuery)}" placeholder="Szukaj ćwiczenia…">
        <div class="segrows">${segs}</div>
      </div>
      <div class="card" style="margin-top:12px">
        <div class="thead" style="${GRID}"><span></span><span>Nazwa</span><span>Kategoria</span><span></span></div>
        ${rows.map(e=>{
          const [cfg,cbg]=CAT[grp(e)]||CAT["Nieprzypisane"];
          const [c2f,c2b]=CAT[e.group2]||CAT["Nieprzypisane"];
          const [c3f,c3b]=CAT[e.group3]||CAT["Nieprzypisane"];
          const [c4f,c4b]=CAT[e.group4]||CAT["Nieprzypisane"];
          const bdg2 = (e.cat2 ? `<span class="badge" style="color:${c2f};background:${c2b}">${esc(e.cat2)}</span>` : "")
                     + (e.cat3 ? `<span class="badge" style="color:${c3f};background:${c3b}">${esc(e.cat3)}</span>` : "")
                     + (e.cat4 ? `<span class="badge" style="color:${c4f};background:${c4b}">${esc(e.cat4)}</span>` : "");
          const th = e.thumb ? `<span class="thumb"><img src="${esc(e.thumb)}" alt="" loading="lazy"></span>`
                             : `<span class="thumb${e.has_film?"":" no"}">${e.has_film?"▶":"—"}</span>`;
          return `<div class="trow ${D.pick?"pick":"static"}" style="${GRID}"${D.pick?` data-act="pick_exercise" data-name="${esc(e.name)}"`:""}>
            ${th}
            <span style="font-size:13.5px;font-weight:600;min-width:0">${esc(e.name)}</span>
            <span style="display:flex;gap:5px;min-width:0;flex-wrap:nowrap;align-items:center"><span class="badge" style="color:${cfg};background:${cbg}">${esc(e.cat)}</span>${bdg2?`<span style="width:26px;flex:none"></span>${bdg2}`:""}</span>
            <button class="iconbtn" data-act="edit_exercise" data-name="${esc(e.name)}">✎</button></div>`;
        }).join("")}
      </div>`;
  } else if (S.exTab==="film") {
    const KATY = (D.categories||[]).filter(c=>c.name!=="Nieprzypisane");
    body = `
      <div class="notice red"><i></i>Wklej link YouTube i zapisz — trafi do Bazy i od razu do wszystkich planów z tym ćwiczeniem.
        Przy okazji ustaw kategorie; nazwę też możesz tu poprawić — zmiana idzie do Bazy i do rozpisek.
        Krzyżyk zdejmuje ćwiczenie z tego katalogu (w rozpiskach zostaje).</div>
      <div style="display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap">
        ${(D.no_film||[]).length ? `<button class="btn sm" data-act="pomin_film_wszystkie">Zdejmij wszystkie z katalogu</button>` : ""}
        ${(D.no_film_skipped||[]).length ? `<button class="btn ghost sm" data-act="pokaz_odlozone">${
          S.odlozone ? "Ukryj" : "Pokaż"} zdjęte (${(D.no_film_skipped||[]).length})</button>` : ""}
      </div>
      ${(D.no_film||[]).length ? "" : `<div style="padding:22px 2px;font-size:13px;color:var(--mute)">Wszystko ma film albo zostało zdjęte z katalogu.</div>`}
      ${S.odlozone ? `<div class="card" style="margin-top:12px;padding:12px 16px">
        <div style="display:flex;flex-wrap:wrap;gap:8px">${(D.no_film_skipped||[]).map(n=>
          `<button class="seg" data-act="przywroc_film" data-name="${esc(n)}"
                   title="Przywróć do katalogu">${esc(n)} ↩</button>`).join("")}</div></div>` : ""}
      <div class="card" style="margin-top:12px">
        ${D.no_film.map(r=>{
          // klucz po nazwie, nie po indeksie: po zapisie lista się skraca i pod
          // tym samym indeksem stoi już inne ćwiczenie (link z FORM trafiłby
          // wtedy do cudzego wpisu)
          const k = "nf:" + r.name;
          const n = FORM["nfname."+k] === undefined ? r.name : FORM["nfname."+k];
          const k1 = FORM["kat."+k]||"", k2 = FORM["kat2."+k]||"";
          const opcje = (wyb, zajete, pusty) => `<option value="">${pusty}</option>`
            + KATY.filter(c=>!zajete.includes(c.name))
                  .map(c=>`<option${wyb===c.name?" selected":""}>${esc(c.name)}</option>`).join("");
          return `<div class="trow static" style="grid-template-columns:minmax(150px,1fr) minmax(150px,1fr) 148px 148px 92px 34px">
          <input class="in sm" style="min-width:0;font-weight:600;background:#fff"
                 data-f="nfname.${esc(k)}" value="${esc(n)}" title="Popraw nazwę ćwiczenia">
          <input class="filminput" data-f="film.${esc(k)}" value="${esc(FORM["film."+k]||"")}"
                 placeholder="https://youtube.com/…">
          <select class="in" style="padding:7px 9px;font-size:12.5px" data-f="kat.${esc(k)}"
                  title="Kategoria główna">${opcje(k1, [], "kategoria…")}</select>
          <select class="in" style="padding:7px 9px;font-size:12.5px" data-f="kat2.${esc(k)}"
                  title="Druga kategoria">${opcje(k2, [k1], "—")}</select>
          <button class="btn sm" data-act="save_film" data-k="${esc(k)}" data-name="${esc(r.name)}">Zapisz</button>
          <button class="iconbtn" data-act="pomin_film" data-name="${esc(r.name)}"
                  title="Nie dodam filmu — zdejmij z katalogu (w rozpiskach zostaje)">✕</button>
        </div>`;}).join("")}
      </div>`;
  } else {
    const CATS = (D.categories||[]).filter(c=>c.name!=="Nieprzypisane");
    body = `
      <div class="notice amber"><i></i>Przypisz kategorie — pierwsza decyduje, do której sekcji planu ćwiczenie trafia domyślnie.
        Nazwę też możesz tu poprawić.</div>
      <div class="card" style="margin-top:12px">
        ${D.no_cat.map(r=>{
          const k = "nc:" + r.name;                       // klucz po nazwie, nie po indeksie
          const n = FORM["ncname."+k] === undefined ? r.name : FORM["ncname."+k];
          const c1 = FORM["cat."+k]||"", c2 = FORM["cat2."+k]||"", c3 = FORM["cat3."+k]||"";
          const opcje = (wyb, zajete) => `<option value="">${zajete.length?"—":"wybierz kategorię…"}</option>`
            + CATS.filter(c=>!zajete.includes(c.name))
                  .map(c=>`<option${wyb===c.name?" selected":""}>${esc(c.name)}</option>`).join("");
          return `<div class="trow static" style="grid-template-columns:1fr 172px 172px 172px 92px 34px">
          <input class="in sm" style="min-width:0;font-weight:600;background:#fff"
                 data-f="ncname.${esc(k)}" value="${esc(n)}" title="Popraw nazwę ćwiczenia">
          <select class="in" style="padding:7px 10px;font-size:13px" data-f="cat.${esc(k)}">${opcje(c1,[])}</select>
          <select class="in" style="padding:7px 10px;font-size:13px" data-f="cat2.${esc(k)}">${opcje(c2,[c1])}</select>
          <select class="in" style="padding:7px 10px;font-size:13px" data-f="cat3.${esc(k)}">${opcje(c3,[c1,c2])}</select>
          <button class="btn sm" data-act="save_cat" data-k="${esc(k)}" data-name="${esc(r.name)}">Zapisz</button>
          <button class="iconbtn" data-act="usun_cwiczenie" data-name="${esc(r.name)}"
                  data-plany="${esc((r.plany||[]).join(", "))}" title="Usuń ćwiczenie">✕</button>
        </div>`;}).join("")}
      </div>`;
  }

  return `<div class="page">
    <div class="pagehead">
      <div><h1>Baza ćwiczeń</h1>
        <div class="sub">${widoczne===null || widoczne===D.exercises.length
          ? esc(D.exercises_total)+" "+odm(D.exercises_total, "ćwiczenie", "ćwiczenia", "ćwiczeń")
          : esc(widoczne)+" z "+esc(D.exercises.length)+" "+odm(D.exercises.length, "ćwiczenia", "ćwiczeń", "ćwiczeń")} · filmy i kategorie wspólne dla wszystkich planów.</div></div>
      <button class="btn primary" data-act="new_exercise">＋ Nowe ćwiczenie</button>
    </div>
    <div class="tabs">${tabs}</div>
    ${body}
  </div>`;
}

/* ---------------------------------------------------------------- modal */
function planModal(){
  if(!S.pmodal) return "";
  const opt = (v, sel) => `<option${v===sel?" selected":""}>${esc(v)}</option>`;
  const wybrany = FORM["pm.athlete"]||"";
  // plany sa wspolne dla obu paneli, wiec zawodnik planu bywa spoza listy
  // aktywnego trenera — bez dopisania go select pokazywalby kogos innego,
  // a Zapisz po cichu przepisalby plan na te osobe
  const lista = (D.athletes_list||[]).slice();
  if(wybrany && !lista.includes(wybrany)) lista.unshift(wybrany);
  const ath = lista.map(a=>opt(a, wybrany)).join("");
  const grp = `<option value="">— bez folderu —</option>`
    + (D.groups||[]).map(g=>opt(g, FORM["pm.group"]||"")).join("");
  const sts = ["Auto","Trwa","Szkic","Zamknięty"]
    .map(x=>opt(x, FORM["pm.status"]||"Auto")).join("");
  return `<div class="scrim" data-act="close_pmodal"><div class="modal" data-stop="1">
    <div class="mh"><b>Plan</b>
      <button class="iconbtn" style="font-size:17px;color:var(--mute2)" data-act="close_pmodal">×</button></div>
    <div class="mb">
      <label class="field"><span>Nazwa planu</span>
        <input class="in" data-f="pm.name" value="${esc(FORM["pm.name"]||"")}"></label>
      <div class="grid2">
        <label class="field"><span>Zawodnik</span><select class="in" data-f="pm.athlete">${ath}</select></label>
        <label class="field"><span>Folder</span><select class="in" data-f="pm.group">${grp}</select></label>
      </div>
      <label class="field"><span>Status</span><select class="in" data-f="pm.status">${sts}</select>
        <span style="font-size:11.5px;color:var(--mute);margin-top:4px">Auto = liczony z dat planu.</span></label>
    </div>
    <div class="mf">
      <button class="btn primary" data-act="save_plan_meta">Zapisz</button>
      <button class="btn ghost" data-act="close_pmodal">Anuluj</button>
    </div>
  </div></div>`;
}

function modal(){
  if(!S.modal) return "";
  const CATS = D.categories||[];
  const cur = FORM["ex.cat"]||"";
  const cats = CATS.map(c=>`<option${cur===c.name?" selected":""}>${esc(c.name)}</option>`).join("");
  const cur2 = FORM["ex.cat2"]||"";
  const cats2 = `<option value="">—</option>`+CATS.filter(c=>c.name!==cur&&c.name!=="Nieprzypisane")
    .map(c=>`<option${cur2===c.name?" selected":""}>${esc(c.name)}</option>`).join("");
  const cur3 = FORM["ex.cat3"]||"";
  const cats3 = `<option value="">—</option>`
    + CATS.filter(c=>c.name!==cur&&c.name!==cur2&&c.name!=="Nieprzypisane")
      .map(c=>`<option${cur3===c.name?" selected":""}>${esc(c.name)}</option>`).join("");
  const cur4 = FORM["ex.cat4"]||"";
  const cats4 = `<option value="">—</option>`
    + CATS.filter(c=>c.name!==cur&&c.name!==cur2&&c.name!==cur3&&c.name!=="Nieprzypisane")
      .map(c=>`<option${cur4===c.name?" selected":""}>${esc(c.name)}</option>`).join("");
  const vid = ytId(FORM["ex.film"]||"");
  const isEdit = !!FORM["ex.id"];
  // Bez data-act na tle: klik obok okna NIE zamyka formularza. Filip tracił
  // przez to wpisane zmiany, gdy kliknął minimalnie poza modal
  // (2026-09-04). Zamyka ×, „Anuluj" i Escape.
  return `<div class="scrim"><div class="modal" data-stop="1">
    <div class="mh"><b>${isEdit?"Ćwiczenie":"Nowe ćwiczenie"}</b>
      <button class="iconbtn" style="font-size:17px;color:var(--mute2)" data-act="close_modal">×</button></div>
    <div class="mb">
      <label class="field"><span>Nazwa</span>
        <input class="in" data-f="ex.name" value="${esc(FORM["ex.name"]||"")}"></label>
      <div class="grid2">
        <label class="field"><span>Kategoria</span><select class="in" data-f="ex.cat">${cats}</select></label>

// polska odmiana: 1 plan / 2-4 plany / 5+ planów
function ile(n, jeden, kilka, wiele){
  const d = n % 10, s = n % 100;
  if(n === 1) return jeden;
  if(d >= 2 && d <= 4 && !(s >= 12 && s <= 14)) return kilka;
  return wiele;
}

  // w trybie edycji kafelek przestaje być jednym wielkim przyciskiem —

  const edycja = `<button class="btn edyt${S.rosterEdit?" on":""}" data-act="roster_edit">`

function screenAthlete(){
  const a = D.athlete;
  const np = a.plans.length + (a.upcoming || []).length + (a.current ? 1 : 0),

  const tab = S.profTab || "przeglad";

  const wyk = a.wykonanie || [];

  return `<div class="page">
    <button class="wroc" data-act="close_athlete">← Podopieczni</button>

const SCREENS = {start:screenStart, plans:screenPlans, plan:screenPlan,
                 exercises:screenExercises, athletes:screenAthletes};
function render(){
  const fa = document.activeElement;
  const keep = (fa && fa.dataset && fa.dataset.f) ? {f:fa.dataset.f, s:fa.selectionStart, e:fa.selectionEnd} : null;
  let view;
  try {
    view = (SCREENS[S.screen]||screenStart)();
  } catch (err) {
    // bez tego pojedynczy wyjatek w widoku przerywa render() i aplikacja
    // zostaje zamrozona az do F5 (2026-09-02: „subs is not defined"
    // w zakladce „Bez kategorii" blokowal caly ekran Bazy)
    console.error("render widoku padl:", err);
    view = `<div class="page"><div class="notice red"><i></i>
      Ten widok nie dał się narysować: ${esc(String(err && err.message || err))}.
      Wybierz inny ekran z panelu po lewej.</div></div>`;
  }
  const opener = S.navCollapsed ? `<button class="navopen" data-act="navtoggle" title="Rozwiń panel">›</button>` : "";
  const u = D.undo;
  const pasekUndo = u ? `<div class="undobar">
      <span>Usunięto plan <b>${esc(u.name || "")}</b>.</span>
      <button data-act="undo_delete_plan">Cofnij</button>
      <button class="x" data-act="zamknij_cofnij" title="Zamknij">✕</button>
    </div>` : "";
  const bylModal = !!document.querySelector(".modal");
  document.getElementById("root").innerHTML =
    `<div class="app">${sidebar()}<div class="main${S.navCollapsed?" nocol":""}">${opener}${coachbar()}${pasekUndo}${view}</div>${modal()}${planModal()}${athleteModal()}${S.askBase?oknoDoBazy():""}</div>`;
  const sc = document.querySelector(".scrim");
  if (sc) {
    // srodek tej czesci iframe, ktora jest teraz na ekranie
    let y = document.documentElement.scrollHeight / 2;
    try {
      const r = frameElement.getBoundingClientRect();
      y = Math.max(0, -r.top) + Math.min(parent.innerHeight, r.height) / 2;
    } catch (_) {}
    sc.style.setProperty("--mtop", Math.round(y) + "px");
  }
  // wartosci pol formularzy wracaja z FORM (innerHTML je kasuje)
  document.querySelectorAll("[data-f]").forEach(el=>{
    const f = el.dataset.f;
    if(!(f in FORM)) return;
    if(el.tagName === "SELECT"){
      // select tez musi odzyskac wybor — inaczej pokazuje „wybierz z listy…",
      // choc formularz pamieta wartosc (i tworzy plan drugi raz)
      const ma = [...el.options].some(o=>o.value===FORM[f]||o.text===FORM[f]);
      if(ma && el.value!==FORM[f]) el.value = FORM[f];
    } else if(el.value!==FORM[f]) el.value = FORM[f];
  });
  if(keep){
    const el = [...document.querySelectorAll("[data-f]")].find(x=>x.dataset.f===keep.f);
    if(el){ el.focus(); try{ if(keep.s!=null) el.setSelectionRange(keep.s, keep.e); }catch(_){} }
  }
  // sidebar ma siegac dolu okna: wysokosc okna rodzica (same-origin), nie 100vh iframe'u
  let H = 720; try { H = Math.max(720, parent.innerHeight - 2); } catch(_) {}
  const app = document.querySelector(".app"); if (app) app.style.minHeight = H + "px";
  SETH(Math.max(H, document.getElementById("root").scrollHeight));
}

/* ---------------------------------------------------------------- zdarzenia */
document.addEventListener("input", e=>{
  const f = e.target.dataset.f; if(!f) return;
  if(f==="planQuery"||f==="exQuery"){ S[f]=e.target.value; render(); return; }
  if(f.startsWith("q.")){ S.q[f.slice(2)]=e.target.value; return; }
  FORM[f]=e.target.value;
  if(/^(cat|cat2|cat3|kat|kat2)\./.test(f)){ render(); }
  else if(f==="ex.cat"){ FORM["ex.sub"]="";
    if(FORM["ex.cat2"]===e.target.value) FORM["ex.cat2"]="";
    if(FORM["ex.cat3"]===e.target.value) FORM["ex.cat3"]="";
    if(FORM["ex.cat4"]===e.target.value) FORM["ex.cat4"]="";
    render(); }
  else if(f==="ex.film"){ render(); }
});
document.addEventListener("keydown", e=>{
  if(e.key!=="Escape") return;
  if(S.askBase){ S.askBase=false; render(); }
  else if(S.modal){ S.modal=false; render(); }
  else if(S.amodal){ S.amodal=null; S.amodalAll=false; S.amodalBlad=""; render(); }
  else if(S.pmodal){ S.pmodal=null; render(); }
  else if(S.menu||S.coachMenu){ S.menu=false; S.coachMenu=false; render(); }
});
document.addEventListener("click", e=>{
  const b = e.target.closest("[data-act]");
  // klik w srodku okna (data-stop) nie moze uruchamiac akcji z ZEWNATRZ —
  // scrim ma data-act="close_modal", wiec bez tego kazde klikniecie
  // w pole formularza zamykalo okno (Filip 2026-09-02: „klikam kategorie
  // i od razu mi zamyka")
  const stop = e.target.closest("[data-stop]");
  if(stop && (!b || !stop.contains(b))) return;
  // rozwiniete menu trenera zaslania przyciski strony (m.in. „Rozpisz plan")
  // — pierwszy klik obok menu tylko je zamyka, zamiast odpalac akcje, w ktora
  // uzytkownik wcale nie celowal
  if((S.menu || S.coachMenu) && !e.target.closest(".coachmenu, .menu")
     && !(b && (b.dataset.act === "coachmenu" || b.dataset.act === "menu"))){
    S.menu = false; S.coachMenu = false; render();
    return;
  }
  if(!b){ if(S.menu||S.coachMenu){ S.menu=false; S.coachMenu=false; render(); } return; }
  const a = b.dataset.act, i = +b.dataset.i;
  switch(a){
    case "toggle_hidden":
      S.hiddenOpen = !S.hiddenOpen; render(); break;
    case "prof_tab":
      S.profTab = b.dataset.v; render(); break;
    case "roster_edit":
      S.rosterEdit = !S.rosterEdit; render(); break;
    case "new_athlete":
      S.amodal = {tryb:"nowy", name:"", coach:D.coach||""};
      S.amodalAll = false;
      FORM["am.name"]=""; FORM["am.coach"]=D.coach||""; FORM["am.plans"]="";
      render(); break;
    case "edit_athlete": {
      const kto = b.dataset.name||"";
      S.amodal = {tryb:"edycja", name:kto};
      S.amodalAll = false;
      FORM["am.name"]=kto; FORM["am.coach"]=D.coach||""; FORM["am.plans"]="";
      render(); break; }
    case "del_athlete":
      S.amodal = {tryb:"usun", name:b.dataset.name||""}; render(); break;
    case "close_amodal":
      S.amodal = null; S.amodalAll = false; S.amodalBlad = ""; render(); break;
    case "amodal_all":
      S.amodalAll = !S.amodalAll; render(); break;
    case "toggle_plan": {
      const id = b.dataset.id||"";
      const cur = (FORM["am.plans"]||"").split(",").filter(Boolean);
      const i = cur.indexOf(id);
      if(i >= 0) cur.splice(i,1); else cur.push(id);
      FORM["am.plans"] = cur.join(",");
      render(); break; }
    case "save_athlete": {
      // to, co Python i tak odrzuci, łapiemy tu — okno zostaje otwarte
      // z wpisanymi danymi, zamiast znikać razem z nimi (audyt 2026-09-05)
      const nazwa = (FORM["am.name"]||"").trim();
      const edycja = S.amodal && S.amodal.tryb==="edycja";
      const zajete = (D.roster||[]).some(a => a.name.toLowerCase() === nazwa.toLowerCase()
                                              && !(edycja && a.name === S.amodal.name));
      if(!nazwa){ S.amodalBlad = "Podaj imię i nazwisko."; render(); break; }
      if(zajete){ S.amodalBlad = `„${nazwa}” już jest na liście.`; render(); break; }
      S.amodalBlad = "";
      act("save_athlete", {name:nazwa, old: edycja ? S.amodal.name : "",
                           coach:FORM["am.coach"]||D.coach||"",
                           plans:(FORM["am.plans"]||"").split(",").filter(Boolean)});
      S.amodal = null; S.amodalAll = false; break; }
    case "hide_athlete":
      act("hide_athlete", {name:b.dataset.name||""});
      S.amodal = null; break;
    case "unhide_athlete":
      act("unhide_athlete", {name:b.dataset.name||""}); break;
    case "roster_view":
      S.rosterView = b.dataset.v;
      try{ localStorage.setItem("aph.roster", S.rosterView); }catch(_){}
      render(); break;
    case "open_athlete":
      // Przegląd od nowa tylko przy wejściu w inną osobę; powrót do tej
      // samej zostaje na zakładce, na której byłem
      if(!D.athlete || D.athlete.name !== b.dataset.name) S.profTab = "przeglad";
      act("open_athlete", {name: b.dataset.name}); break;
    case "close_athlete":
      act("close_athlete"); break;
    case "nav":
      S.menu = false; S.coachMenu = false;
      if(b.dataset.v==="testing"){ act("navigate",{to:"testing"}); break; }
      // otwarty plan zostaje otwarty (Filip 2026-09-05) — Python i tak odeśle
      // ekran planu, więc bez skoku przez listę
      if(!(b.dataset.v==="plans" && S.screen==="plan")) S.screen = b.dataset.v;
      if(b.dataset.tab) S.exTab = b.dataset.tab;
      if(S.screen==="plans") S.planTab = "plany";
      S.share = false; S.menu = false; render(); act("navigate",{to:b.dataset.v}); break;
    case "new_plan_start":
      S.screen = "plans"; S.planTab = "nowy"; S.share = false; S.menu = false;
      render(); act("navigate",{to:"plans"}); break;
    case "plantab": S.planTab = b.dataset.v; render(); break;
    case "in_base_tak":
    case "in_base_nie":
      S.askBase = false; render();
      act("plan_in_base",{plan_id:D.plan.id, yes:a==="in_base_tak", zamknij:true}); break;
    case "toggle_in_base":
      act("plan_in_base",{plan_id:D.plan.id, yes:D.plan.in_base!==true}); break;
    case "extab":   S.exTab   = b.dataset.v; render(); break;
    case "cat":     S.cat     = b.dataset.v; render(); break;
    case "share":   S.share = !S.share; S.menu = false; render(); break;
    case "menu":    S.menu = !S.menu; render(); break;
    case "coachmenu": S.coachMenu = !S.coachMenu; render(); break;
    case "grp": S.grp = b.dataset.v; render(); break;
    case "add_group": {
      const n = prompt("Nazwa nowego folderu:", "");
      if(n && n.trim()) act("add_group",{name:n.trim()});
      } break;
    case "rename_group": {
      const n = prompt("Nowa nazwa folderu „"+S.grp+"”:", S.grp);
      if(n && n.trim() && n.trim()!==S.grp){ const stara=S.grp; S.grp=n.trim(); render();
        act("rename_group",{old:stara, name:n.trim()}); }
      } break;
    case "del_group": {
      const ile = D.plans.filter(x=>x.group===S.grp).length;
      const tekst = ile ? "Usunąć folder „"+S.grp+"”?\n"+ile+" planów zostanie bez folderu (same plany zostają)."
                        : "Usunąć pusty folder „"+S.grp+"”?";
      if(confirm(tekst)){ const g=S.grp; S.grp="Wszystkie"; render(); act("delete_group",{name:g}); }
      } break;
    case "edit_plan_row": {
      const pl = D.plans.find(x=>x.id===b.dataset.id) || {};
      FORM["pm.name"]=pl.name||""; FORM["pm.athlete"]=pl.athlete||"";
      FORM["pm.group"]=pl.group||""; FORM["pm.status"]=pl.status_set||"Auto";
      S.pmodal = b.dataset.id; render(); } break;
    case "close_pmodal": S.pmodal=null; render(); break;
    case "save_plan_meta": {
      if(!(FORM["pm.name"]||"").trim()){ alert("Podaj nazwę planu."); break; }
      const id=S.pmodal; S.pmodal=null; render();
      act("save_plan_meta",{plan_id:id, name:FORM["pm.name"]||"",
        athlete:FORM["pm.athlete"]||"", group:FORM["pm.group"]||"",
        status:FORM["pm.status"]||"Auto"}); } break;
    case "row_group": {
      const pl = D.plans.find(x=>x.id===b.dataset.id) || {};
      const lista = (D.groups||[]).join(" · ");
      const g = prompt("Folder dla planu „"+(pl.name||"")+"”"
                       + (lista ? "\nistniejące: "+lista : "")
                       + "\n(puste = bez folderu)", pl.group||"");
      if(g!==null) act("set_group",{plan_id:b.dataset.id, group:g.trim()});
      } break;
    case "ask_group": {
      S.menu = false; render();
      const g = prompt("Folder dla planu „"+D.plan.name+"” (puste = bez folderu):",
                       (D.plans.find(x=>x.id===D.plan.id)||{}).group||"");
      if(g!==null) act("set_group",{plan_id:D.plan.id, group:g.trim()});
      } break;
    case "switch_coach":
      S.coachMenu = false; S.screen = "start"; S.planTab = "plany"; S.share = false; S.menu = false;
      render(); act("switch_coach",{id:b.dataset.id}); break;
    case "navtoggle": S.navCollapsed = !S.navCollapsed; render(); break;
    case "dyktando": act("dyktando",{}); break;
    case "undo_delete_plan": case "zamknij_cofnij":
      D.undo = null; render(); act(a, {}); break;
    case "edit_plan": case "copy_plan": case "dup_plan": case "pdf_kartka": case "regen_link":
      S.menu = false; render(); act(a,{plan_id:D.plan.id}); break;
    case "delete_plan":
      S.menu = false; render();
      if(confirm("Usunąć plan „"+D.plan.name+"”?\n\nWróci przyciskiem „Cofnij”, a potem z kosza na liście planów.")) act("delete_plan",{plan_id:D.plan.id}); break;
    case "pick_exercise": act("pick_exercise",{name:b.dataset.name, section:FORM["pick.section"]||(D.pick&&D.pick.section)||"Main"}); break;
    case "pick_back":     act("pick_back",{}); break;
    case "delete_exercise":
      if(confirm("Usunąć ćwiczenie „"+(FORM["ex.name"]||"")+"” z Bazy?")){ S.modal=false; render(); act("delete_exercise",{id:FORM["ex.id"]||""}); } break;
    case "open_plan":     act("open_plan",{id:b.dataset.id, skad:S.screen}); break;
    case "close_plan":
      // pytanie pada raz na plan i tylko gdy jest co zatwierdzać
      if(D.plan && D.plan.in_base === null && (D.plan.workouts||[]).some(w=>w.count>0)){
        S.askBase = true; render(); break; }    act("close_plan"); break;
    case "open_workout":  act("open_workout",{plan_id:D.plan.id, letter:b.dataset.letter, sid:b.dataset.sid||""}); break;
    case "queue_open":    act("queue_open",{item:D.queue[i]}); break;
    case "queue_del":     { const it=D.queue[i]; D.queue.splice(i,1); render(); act("queue_del",{index:i, id:it&&it.id}); } break;
    case "queue_add":
      if(S.q.name){ act("queue_add",{item:{...S.q}}); S.q={name:"",plan:"",date:""}; render(); } break;
    case "create_plan": {
      if(!(FORM["np.name"]||"").trim()){ alert("Podaj nazwę planu."); break; }
      const kto = (FORM["np.new_athlete"]||"").trim()
        || ((FORM["np.athlete"]||"").startsWith("wybierz") ? "" : (FORM["np.athlete"]||"").trim());
      if(!kto){ alert("Wybierz zawodnika albo wpisz nowego."); break; }
      S.planTab = "plany";
      act("create_plan",{form:Object.fromEntries(Object.entries(FORM)
        .filter(([k])=>k.startsWith("np.")).map(([k,v])=>[k.slice(3),v]))});
      // formularz zostawal wypelniony i nastepna rozpiska dziedziczyla
      // nazwe oraz folder poprzedniej
      Object.keys(FORM).filter(k=>k.startsWith("np.")).forEach(k=>delete FORM[k]);
      render();
      } break;
    case "pdf":           act("pdf",{plan_id:D.plan.id}); break;
    case "copy_link":     { const u=D.plan.share_url; try{ navigator.clipboard && navigator.clipboard.writeText(u); }catch(_){}
                            act("copy_link",{url:u}); } break;
    case "add_workout":   act("add_workout",{plan_id:D.plan.id}); break;
    case "new_exercise":
      FORM["ex.id"]=""; FORM["ex.name"]=""; FORM["ex.cat2"]=""; FORM["ex.cat3"]=""; FORM["ex.cat4"]=""; FORM["ex.cat"]=(D.categories&&D.categories[0]?D.categories[0].name:"Movement Prep");
      FORM["ex.sub"]=""; FORM["ex.film"]=""; S.modal=true; render(); break;
    case "edit_exercise": {
      const ex = D.exercises.find(x=>x.name===b.dataset.name) || {};
      FORM["ex.id"]=ex.id||""; FORM["ex.name"]=ex.name||b.dataset.name||""; FORM["ex.cat"]=ex.cat||"Nieprzypisane";
      FORM["ex.sub"]=ex.sub||""; FORM["ex.cat2"]=ex.cat2||""; FORM["ex.cat3"]=ex.cat3||"";
      FORM["ex.cat4"]=ex.cat4||"";
      FORM["ex.film"]=ex.url||""; S.modal=true; render(); } break;
    case "close_modal":   S.modal=false; render(); break;
    case "save_exercise": {
      const nazwa = (FORM["ex.name"]||"").trim();
      if(!nazwa){ alert("Podaj nazwę ćwiczenia."); break; }
      const kolizja = (D.exercises||[]).some(x =>
        x.name.toLowerCase() === nazwa.toLowerCase() && x.id !== (FORM["ex.id"]||""));
      if(kolizja){ alert("Ćwiczenie o tej nazwie już jest w Bazie."); break; }
      S.modal=false; render();
      act("save_exercise",{form:{id:FORM["ex.id"]||"", name:FORM["ex.name"]||"", cat:FORM["ex.cat"]||"",
                                 sub:FORM["ex.sub"]||"", cat2:FORM["ex.cat2"]||"",
                                 cat3:FORM["ex.cat3"]||"",
                                 cat4:FORM["ex.cat4"]||"",
                                 film:FORM["ex.film"]||""}}); } break;
    case "save_film": {
      const k = b.dataset.k||"";
      act("save_film",{name:b.dataset.name, newname:FORM["nfname."+k]||"", url:FORM["film."+k]||"",
                       cat:FORM["kat."+k]||"", cat2:FORM["kat2."+k]||""});
      delete FORM["nfname."+k]; delete FORM["film."+k];
      delete FORM["kat."+k]; delete FORM["kat2."+k]; break; }
    case "pomin_film":
      act("pomin_film",{name:b.dataset.name}); break;
    case "przywroc_film":
      act("przywroc_film",{name:b.dataset.name}); break;
    case "pokaz_odlozone": S.odlozone = !S.odlozone; render(); break;
    case "pomin_film_wszystkie":
      if(confirm("Zdjąć wszystkie "+(D.no_film||[]).length+" ćwiczeń z katalogu Bez filmu?\n\n"
                +"W rozpiskach zostają bez zmian — znikają tylko z tej listy."))
        act("pomin_film_wszystkie",{});
      break;
    case "usun_cwiczenie": {
      const nazwa = b.dataset.name||"", plany = (b.dataset.plany||"").trim();
      const gdzie = plany ? "\n\nZniknie też z rozpisek: " + plany : "";
      if(confirm("Usunąć „"+nazwa+"” z Bazy ćwiczeń?"+gdzie+"\n\nTej operacji nie da się cofnąć."))
        act("usun_cwiczenie",{name:nazwa});
      break; }
    case "save_cat": {
      const k = b.dataset.k||"";
      act("save_cat",{name:b.dataset.name, newname:FORM["ncname."+k]||"",
                      cat:FORM["cat."+k]||"", cat2:FORM["cat2."+k]||"", cat3:FORM["cat3."+k]||""});
      delete FORM["ncname."+k]; delete FORM["cat."+k]; delete FORM["cat2."+k]; delete FORM["cat3."+k]; break; }
  }
});

/* ---------------------------------------------------------------- wejście z Pythona */
let LAST_DL = null, LAST_PF = null;
// Stan powłoki odesłany z Pythona (exview) stosujemy RAZ — przy pierwszym
// renderze po odbudowie komponentu. Każde render() woła setFrameHeight,
// a Streamlit odpowiada echem „streamlit:render" z tymi samymi args (pomiar
// 2026-09-05: dwa echa w 45 ms po kliknięciu w folder). Bez tej flagi echo
// nadpisywało świeżo kliknięty filtr/zakładkę starą wartością i klik w folder
// albo zakładkę Bazy wyglądał, jakby nie działał.
let EXVIEW_ZASTOSOWANY = false;
window.addEventListener("message", ev=>{
  const d = ev.data; if(!d || d.type!=="streamlit:render") return;
  const args = d.args || {};
  if(args.data)   D = Object.assign({}, D, args.data);
  if(args.screen) S.screen = args.screen;
  // Po każdej akcji Python przebudowuje komponent, a stan JS startuje od zera —
  // usunięcie ćwiczenia z zakładki „Bez kategorii" wyrzucało na „Wszystkie"
  // i kasowało filtr. Odtwarzamy widok Bazy z tego, co zapamiętał Python.
  if(args.exview && !EXVIEW_ZASTOSOWANY){
    EXVIEW_ZASTOSOWANY = true;
    if(args.exview.tab)       S.exTab     = args.exview.tab;
    if(args.exview.cat)       S.cat       = args.exview.cat;
    if(args.exview.query)     S.exQuery   = args.exview.query;
    if(args.exview.grp)       S.grp       = args.exview.grp;
    if(args.exview.planQuery) S.planQuery = args.exview.planQuery;
    if(args.exview.profTab)   S.profTab   = args.exview.profTab;
  }
  // wybór ćwiczenia do rozpiski działa tylko na liście „Wszystkie" — gdyby
  // Baza została na „Bez filmu", nie dałoby się kliknąć w żadne ćwiczenie.
  // Musi być PO exview, inaczej odtworzona zakładka nadpisze ten wybór.
  if(args.data && args.data.pick) S.exTab = "all";
  if(!args.data || !args.data.pick) D.pick = null;
  const pf = args.prefill;
  if(pf && pf.nonce!==LAST_PF){ LAST_PF = pf.nonce; S.planTab = "nowy";
    FORM["np.new_athlete"]=pf.athlete||""; FORM["np.name"]=pf.name||""; FORM["np.athlete"]=""; }
  render();
  const dl = args.download;
  if(dl && dl.nonce!==LAST_DL){ LAST_DL = dl.nonce;
    const a = document.createElement("a"); a.href = "data:"+(dl.mime||"application/pdf")+";base64,"+dl.b64;
    a.download = dl.name || "plan.pdf"; document.body.appendChild(a); a.click(); a.remove(); }
});
READY(); render();
window.addEventListener("resize", render);
</script>
</body>
</html>
